<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Harness Engineering: Design Patterns for Securing Long-Horizon Multi-Agent AI Systems — 53 Slides</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F0EEE6;
      --surface: #FAF9F5;
      --surface-alt: #F5E6DF;
      --ink: #141413;
      --ink-muted: #6B6B63;
      --rule: #E3E0D6;
      --accent: #D97757;
      --accent-dk: #BD5D3A;
      --accent-sf: #F5E6DF;
      --code-bg: #1A1A18;
      --code-rule: #333330;
      --font-display: ui-serif, Georgia, "Times New Roman", serif;
      --font-body: -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
      --font-code: ui-monospace, "JetBrains Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--ink);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      height: 46px;
      flex: 0 0 46px;
      background: var(--surface);
      border-bottom: 1px solid var(--rule);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1.0rem;
      z-index: 50;
      gap: 0.75rem;
      overflow-x: auto;
    }
    .header-left { display: flex; align-items: center; gap: 0.7rem; flex: 0 0 auto; }
    .brand-logo {
      width: 30px; height: 30px;
      background: var(--accent-sf); color: var(--ink); border: 1px solid var(--rule);
      border-radius: 8px; font-weight: 800; display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem;
    }
    .brand-title { font-weight: 650; font-size: 0.90rem; white-space: nowrap; }

.lang-switch { display: flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; flex: 0 0 auto; }
    .lang-btn { border: none; border-radius: 0; min-width: 3.1rem; }
    .lang-btn.is-active { background: var(--accent); border-color: var(--accent); }
    body.lang-zh, body.lang-zh .slide-title, body.lang-zh .slide-body, body.lang-zh .slide-select, body.lang-zh .brand-title {
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", var(--font-body);
    }
    body.lang-zh .slide-title { letter-spacing: 0; }


    .controls { display: flex; align-items: center; gap: 0.40rem; flex: 0 0 auto; }
    .btn {
      background: var(--surface); border: 1px solid var(--rule); color: var(--ink);
      padding: 0.35rem 0.65rem; border-radius: 8px; font-weight: 600; font-size: 0.80rem;
      cursor: pointer; transition: background-color 0.16s, border-color 0.16s; text-decoration: none;
      white-space: nowrap;
    }
    .btn:hover { background: var(--accent-sf); border-color: var(--accent); }
    .btn:focus-visible, .slide-select:focus-visible, .goto-input:focus-visible { outline: 2px solid var(--accent-dk); outline-offset: 2px; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--ink); font-weight: 700; }
    .btn-primary:hover { background: var(--accent-sf); border-color: var(--accent-dk); color: var(--ink); }
    
    .goto-group {
      display: flex;
      align-items: center;
      gap: 0.22rem;
      background: var(--bg);
      padding: 0.12rem 0.25rem;
      border-radius: 8px;
      border: 1px solid var(--rule);
    }
    .goto-input {
      width: 48px;
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--rule);
      padding: 0.25rem 0.35rem;
      border-radius: 6px;
      font-family: var(--font-code);
      font-size: 0.80rem;
      font-weight: 750;
      text-align: center;
      -moz-appearance: textfield;
    }
    .goto-input::-webkit-outer-spin-button,
    .goto-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .btn-goto {
      padding: 0.26rem 0.50rem;
      font-weight: 700;
      font-size: 0.78rem;
    }

    select.slide-select {
      background: var(--surface); color: var(--ink); border: 1px solid var(--rule);
      padding: 0.35rem 0.55rem; border-radius: 8px; font-family: var(--font-body);
      font-size: 0.80rem; font-weight: 600;
      max-width: 290px;
    }

    main {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .slide-viewport {
      width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      padding: clamp(0.30rem, 0.8vw, 0.70rem);
    }
    .slide-card {
      width: 100%; max-width: 1380px; height: 100%;
      background: var(--surface); border: 1px solid var(--rule);
      border-radius: 12px; padding: clamp(0.80rem, 1.5vw, 1.40rem); display: flex; flex-direction: column;
      position: relative; overflow: hidden;
    }
    .slide-header {
      display: flex; justify-content: space-between; align-items: center;
      gap: 0.8rem; margin-bottom: 0.35rem; border-bottom: 1px solid var(--rule); padding-bottom: 0.35rem;
      flex: 0 0 auto;
    }
    .slide-title-wrap { min-width: 0; }
    .slide-title {
      font-family: var(--font-display); font-size: clamp(1.40rem, 2.2vw, 1.95rem);
      font-weight: 700; line-height: 1.15; letter-spacing: -0.015em; color: var(--ink);
    }
    .slide-header-right {
      display: flex;
      align-items: center;
      gap: 0.60rem;
      flex: 0 0 auto;
    }
    .packt-logo-link {
      display: inline-flex;
      align-items: center;
      padding: 0.18rem 0.50rem;
      background: #FAF8F2;
      border: 1.2px solid var(--rule);
      border-radius: 6px;
      transition: all 0.16s ease-in-out;
      text-decoration: none;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }
    .packt-logo-link:hover {
      background: var(--accent-sf);
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .packt-title-logo {
      height: 22px;
      width: auto;
      display: block;
    }
    .slide-num-badge {
      background: var(--accent-sf); color: var(--ink); border: 1px solid var(--rule);
      padding: 0.22rem 0.60rem; border-radius: 9999px; font-size: 0.78rem; font-weight: 750; white-space: nowrap;
      flex: 0 0 auto;
    }
    .slide-body {
      --fit-scale: 1;
      --slide-body-base-size: 1.30rem;
      flex: 1; min-height: 0; overflow-y: auto; padding-right: 0.20rem;
      font-size: calc(var(--slide-body-base-size) * var(--fit-scale));
      line-height: 1.50; color: var(--ink);
    }

    code {
      font-family: var(--font-code);
      background: var(--accent-sf);
      color: var(--accent-dk);
      padding: 0.08rem 0.32rem;
      border-radius: 4px;
      font-size: 0.90em;
      white-space: nowrap;
      border: 1px solid var(--rule);
    }
    pre code, .tree-block code, .code-editor-body code {
      white-space: pre !important;
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      color: inherit !important;
    }
    .slide-content-wrapper {
      width: 100%;
      display: block;
    }
    .slide-body > svg, .slide-svg {
      display: block; width: 100% !important; height: auto; max-width: 100%;
      margin: 0.35rem 0 0.65rem 0;
    }

    /* Comparison Table Styling */
    .slide-table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      margin: 0.35rem 0 0.60rem 0;
      font-size: 0.88rem;
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .slide-table th {
      overflow-wrap: break-word;
      background: var(--accent-sf);
      color: var(--ink);
      font-weight: 750;
      text-align: left;
      padding: 0.45rem 0.70rem;
      border-bottom: 1.5px solid var(--rule);
      font-family: var(--font-display);
      font-size: 0.95rem;
    }
    .slide-table td {
      overflow-wrap: break-word;
      padding: 0.40rem 0.70rem;
      border-bottom: 1px solid var(--rule);
      color: var(--ink);
      line-height: 1.38;
      vertical-align: middle;
    }
    .slide-table tr:last-child td {
      border-bottom: none;
    }
    .slide-table tr:nth-child(even) td {
      background: rgba(245, 230, 223, 0.25);
    }

    /* Enhanced Code Slide Layout with Line-Level Highlights */
    .code-slide-container {
      display: grid;
      grid-template-columns: minmax(0, 1.32fr) minmax(0, 1.08fr);
      gap: 1.05rem;
      height: 100%;
      align-items: start;
    }
    @media (max-width: 1020px) {
      .code-slide-container {
        grid-template-columns: 1fr;
        height: auto;
      }
    }

    .code-editor-window {
      background: var(--code-bg);
      border: 1px solid var(--code-rule);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 16px rgba(0,0,0,0.14);
      max-height: calc(100vh - 135px);
    }
    .code-editor-header {
      background: #242320;
      border-bottom: 1px solid var(--code-rule);
      padding: 0.40rem 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    .code-dots {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .code-dot {
      width: 9px; height: 9px; border-radius: 50%;
    }
    .dot-red { background: #E06C75; }
    .dot-yellow { background: #E5C07B; }
    .dot-green { background: #98C379; }
    .code-file-tag {
      font-family: var(--font-code);
      font-size: 0.78rem;
      color: #A0A09A;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .code-lang-tag {
      background: #333330;
      color: #D97757;
      font-family: var(--font-code);
      font-size: 0.70rem;
      padding: 0.12rem 0.45rem;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .code-block {
      background: var(--code-bg);
      color: #FAF9F5;
      font-family: var(--font-code);
      font-size: 0.86rem;
      line-height: 1.42;
      padding: 0.45rem 0;
      margin: 0;
      overflow-x: auto;
      overflow-y: auto;
    }

    .code-line {
      display: flex;
      align-items: baseline;
      padding: 0.06rem 0.55rem;
      transition: background-color 0.15s;
    }
    .code-line:hover {
      background: rgba(255, 255, 255, 0.04);
    }
    .code-line-hl {
      background: rgba(217, 119, 87, 0.22);
      border-left: 3.5px solid var(--accent);
      padding-left: calc(0.55rem - 3.5px);
    }
    .line-num {
      color: #5C5C56;
      width: 24px;
      flex: 0 0 24px;
      text-align: right;
      margin-right: 8px;
      font-size: 0.78rem;
      user-select: none;
    }
    .code-line-hl .line-num {
      color: var(--accent);
      font-weight: 700;
    }
    .key-badge {
      background: var(--accent);
      color: #FAF9F5;
      font-size: 0.62rem;
      font-weight: 800;
      padding: 0.05rem 0.35rem;
      border-radius: 3px;
      margin-right: 8px;
      letter-spacing: 0.03em;
      user-select: none;
      flex: 0 0 auto;
    }
    .line-code {
      flex: 1;
      white-space: pre;
    }

    /* Syntax Highlighting Colors */
    .tok-kw { color: #E58A6D; font-weight: 600; }
    .tok-str { color: #89CA78; }
    .tok-com { color: #7F7F78; font-style: italic; }
    .tok-dec { color: #E5C07B; font-weight: 600; }
    .tok-typ { color: #61AFEF; font-weight: 600; }
    .tok-fn { color: #61AFEF; font-weight: 600; }
    .tok-cls { color: #E5C07B; font-weight: 700; }

    /* Code Slide Dedicated Concepts Column */
    .code-concepts-column {
      display: flex;
      flex-direction: column;
      gap: 0.60rem;
      overflow-y: auto;
      max-height: calc(100vh - 135px);
      padding-right: 0.20rem;
    }
    .code-concepts-list {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    .code-concept-card {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-left: 3.5px solid var(--accent);
      border-radius: 8px;
      padding: 0.65rem 0.90rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }
    .concept-card-head {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      margin-bottom: 0.25rem;
      flex-wrap: wrap;
    }
    .concept-tag {
      background: var(--accent);
      color: #FAF9F5;
      font-size: 0.70rem;
      font-weight: 750;
      padding: 0.10rem 0.42rem;
      border-radius: 4px;
      font-family: var(--font-code);
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .concept-name {
      font-family: var(--font-display);
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--ink);
    }
    .concept-card-text {
      font-size: 0.92rem;
      color: var(--ink);
      line-height: 1.42;
    }

    .invariant-card {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-left: 3.5px solid var(--accent-dk);
      border-radius: 8px;
      padding: 0.65rem 0.90rem;
      font-size: 0.88rem;
      color: var(--ink-muted);
      line-height: 1.40;
    }
    .invariant-title {
      font-family: var(--font-display);
      font-size: 1.00rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 0.22rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    /* Dedicated Skill Slide Layout */
    .skill-slide-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.0fr) minmax(0, 1.15fr);
      gap: 1.25rem;
      height: 100%;
      align-items: start;
    }
    @media (max-width: 980px) {
      .skill-slide-layout {
        grid-template-columns: 1fr;
        height: auto;
      }
    }
    .skill-meta-card {
      background: var(--surface);
      border: 1.5px solid var(--accent);
      border-radius: 10px;
      padding: 1.10rem;
      display: flex;
      flex-direction: column;
      gap: 0.70rem;
      box-shadow: 0 4px 14px rgba(217, 119, 87, 0.08);
    }
    .skill-meta-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--accent-sf);
      color: var(--accent-dk);
      border: 1px solid var(--accent);
      font-family: var(--font-code);
      font-weight: 800;
      font-size: 0.84rem;
      padding: 0.24rem 0.60rem;
      border-radius: 6px;
      width: fit-content;
    }
    .skill-name-heading {
      font-family: var(--font-code);
      font-size: 1.30rem;
      font-weight: 800;
      color: var(--ink);
      word-break: break-all;
    }
    .skill-desc-box {
      background: #FAF8F2;
      border: 1px solid var(--rule);
      border-left: 3.5px solid var(--accent);
      border-radius: 6px;
      padding: 0.70rem 0.90rem;
      font-size: 0.96rem;
      line-height: 1.46;
      color: var(--ink);
    }
    .skill-tools-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--ink);
    }
    .skill-links-box {
      font-size: 0.88rem;
      color: var(--ink-muted);
      margin-top: 0.3rem;
      line-height: 1.46;
      display: flex;
      flex-direction: column;
      gap: 0.38rem;
      border-top: 1px dashed var(--rule);
      padding-top: 0.55rem;
    }
    .skill-details-column {
      display: flex;
      flex-direction: column;
      gap: 0.70rem;
      overflow-y: auto;
      max-height: calc(100vh - 135px);
    }
    .skill-detail-card {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-left: 3.5px solid var(--accent-dk);
      border-radius: 8px;
      padding: 0.75rem 1.00rem;
    }
    .skill-detail-title {
      font-family: var(--font-display);
      font-size: 1.08rem;
      font-weight: 750;
      color: var(--ink);
      margin-bottom: 0.30rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .skill-detail-body {
      font-size: 0.94rem;
      color: var(--ink);
      line-height: 1.44;
    }

    /* Monospace Tree Display for Structure Slides */
    .tree-block {
      background: var(--code-bg);
      color: #FAF9F5;
      font-family: var(--font-code);
      font-size: 0.86rem;
      line-height: 1.44;
      padding: 0.80rem 1.05rem;
      border-radius: 8px;
      border: 1px solid var(--code-rule);
      margin: 0.45rem 0;
      overflow-x: auto;
    }

    /* Visual Hierarchy: Parent vs Sub Bullets */
    .main-bullets { list-style-type: none; padding-left: 0; margin-top: 0.30rem; }
    .main-bullets.dense-columns {
      column-count: 2; column-gap: clamp(1.2rem, 3vw, 2.5rem); column-fill: balance;
    }
    .bullet-group, .primary-bullet, .sub-bullets, .sub-bullet {
      break-inside: avoid; page-break-inside: avoid;
    }
    .primary-bullet {
      font-family: var(--font-display); font-size: 1.04em; font-weight: 650; color: var(--ink);
      margin-top: 0.35em; margin-bottom: 0.18em; position: relative; padding-left: 1.25em; line-height: 1.46;
    }
    .primary-bullet::before {
      content: "◆"; color: var(--accent); font-size: 0.72em; line-height: 1; position: absolute; left: 0; top: 0.18em;
    }
    .sub-bullets {
      list-style-type: none; padding-left: 1.25em; border-left: 2px solid var(--rule);
      margin-left: 0.40em; margin-top: 0.20em; margin-bottom: 0.40em; display: flex; flex-direction: column; gap: 0.22em;
    }
    .sub-bullet {
      font-size: 0.92em; color: var(--ink); margin-bottom: 0.15em; position: relative; padding-left: 1.15em;
      line-height: 1.42;
    }
    .sub-bullet::before {
      content: "›"; position: absolute; left: 0; top: -0.05em; color: var(--accent-dk); font-weight: 900; font-size: 1.25em; line-height: 1;
    }
    .slide-lead-header {
      font-family: var(--font-display);
      font-size: 1.15em;
      font-weight: 750;
      color: var(--accent-dk);
      margin-top: 0.15em;
      margin-bottom: 0.40em;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 0.4em;
    }

    /* Capstone Slide 83 Two-Column Grid */
    .capstone-layout-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr);
      gap: 0.90rem;
      height: 100%;
      align-items: stretch;
    }
    @media (max-width: 1040px) {
      .capstone-layout-grid {
        grid-template-columns: 1fr;
        height: auto;
      }
    }
    .capstone-info-card {
      background: var(--surface);
      border: 1.5px solid var(--rule);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 3px 12px rgba(0,0,0,0.04);
    }
    .capstone-info-body {
      padding: 0.60rem 0.80rem;
      display: flex;
      flex-direction: column;
      gap: 0.50rem;
      font-size: 0.84rem;
      background: var(--surface);
      flex: 1;
    }
    .capstone-section {
      display: flex;
      flex-direction: column;
      gap: 0.22rem;
    }
    .capstone-section-title {
      font-family: var(--font-display);
      font-size: 0.84rem;
      font-weight: 750;
      color: var(--accent-dk);
    }
    .capstone-cmd-box {
      background: #FAF8F2;
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 0.35rem 0.55rem;
      display: flex;
      flex-direction: column;
      gap: 0.22rem;
      font-size: 0.77rem;
    }
    .capstone-cmd-box code {
      font-size: 0.78rem;
      padding: 0.08rem 0.28rem;
    }
    .cmd-note {
      color: var(--ink-muted);
      font-size: 0.75rem;
      margin-left: 0.25rem;
    }
    .capstone-providers-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.25rem;
      font-size: 0.75rem;
    }
    .provider-pill {
      background: #FAF8F2;
      border: 1px solid var(--rule);
      border-radius: 5px;
      padding: 0.22rem 0.40rem;
      line-height: 1.25;
    }
    .capstone-text-desc {
      font-size: 0.78rem;
      line-height: 1.38;
      color: var(--ink);
      background: #FAF8F2;
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 0.35rem 0.55rem;
    }

  <script>
    const slidesData = [{"number": 1, "raw_lines": ["Advanced Harness Engineering: Design Patterns for Securing Long-Horizon Multi-Agent AI Systems", "Instructor: Ken Huang, CISSP", "Adjunct Professor, University of San Francisco: https://www.usfca.edu/faculty/ken-huang", "CEO, DistributedApps.ai: https://distributedapps.ai/", "Substack: https://kenhuangus.substack.com/", "LinkedIn: https://www.linkedin.com/in/kenhuang8/"]}, {"number": 2, "raw_lines": ["About the Instructor: Ken Huang, CISSP", "• 📚 AI Book Author & Speaker (Harness Engineering, MAESTRO)", "• 🎓 Adjunct Professor, University of San Francisco: https://www.usfca.edu/faculty/ken-huang", "• 🛡️ OWASP AIVSS Project Lead", "• 🤝 Fellow & Co-Chair of two CSA AI Safety Working Groups", "• 🔟 Core Member, OWASP Top 10 for LLM Applications", "• 🏛️ AIUC-1 Consortium Member", "• 🔬 Grant Review Member for Schmidt Sciences", "• 🧑‍🏫 EC-Council Instructor — Generative AI for Cyber Security", "• 🚀 CEO of DistributedApps.ai: https://distributedapps.ai/", "• ✍️ Substack: https://kenhuangus.substack.com/ | 💼 LinkedIn: https://www.linkedin.com/in/kenhuang8/"]}, {"number": 3, "raw_lines": ["The Thesis: Secure Long-Horizon Agents Need a Control Plane, Not Better Prompts", "The book's central claim (Ch 1 Abstract): secure long-horizon multi-agent systems are not made safe by prompts alone, nor by threat awareness alone, but by a harness that acts as the control plane for autonomy.", "• What the harness mediates: what agents may perceive, remember, decide, call, delegate, revise, and prove.", "• Where security, reliability, governance, evaluation, and operational recovery become one discipline — not five separate tools.", "• How improvement works: hill climbing. Long-running agents improve through local search — but only when mandatory gates stay in place.", "• Positioning: this book engineers and tests the controls that keep long-horizon agents within authorized boundaries — threats → enforceable controls → operational evidence → measured outcomes.", "• How this course works: ten chapters, ten design patterns, ten runnable labs. Each pattern is stated in the chapter, then run as code."]}, {"number": 4, "raw_lines": ["COURSE MAP · 53 Slides, 10 Chapters, 10 Labs", "Four slides per chapter — two concept slides, one code lab, one evidence lab. Chapter 1 adds the reference architecture; the closing adds measured results and implementation boundaries.", "| Chapter | Slides | Pattern | Lab score |", "|---|---|---|---|", "| 1 Control Plane | 7–10 | Harness as control plane | ch01 0.980 |", "| 2 Autonomy | 11–14 | Graduated control, review board | ch02 1.000 |", "| 3 Identity | 15–18 | Per-agent identity, delegation | ch03 1.000 |", "| 4 Intent | 19–22 | Intent contracts, drift | ch04 1.000 |", "| 5 Context | 23–26 | Trust tiers, quarantine | ch05 1.000 |", "| 6 Memory | 27–30 | State firewall, ledger | ch06 1.000 |", "| 7 Observability | 31–34 | Evidence traces, hill climbing | ch07 1.000 |", "| 8 Runtime Steering | 35–38 | Interrupts, safe rollback | ch08 1.000 |", "| 9 Scalability | 39–42 | Fleet admission, bulkheads | ch09 1.000 |", "| 10 Data Governance | 43–46 | Classification-aware routing | ch10 1.000 |", "• Closing (47–53): measured adversarial results, capstone, judging, implementation boundaries, production mapping, pattern catalog, references."]}, {"number": 5, "raw_lines": ["Setup: Get to a Green Run Before Chapter 1", "• Step 1 — Clone: git clone https://github.com/kenhuangus/Harness-Engineering-Design-Patterns.git", "• Step 2 — Venv: python3 -m venv .venv && source .venv/bin/activate", "• Step 3 — Install: python -m pip install -e .", "• Step 4 — List: python -m harnesslab.cli list  (shows ch01–ch10)", "• Step 5 — Run all: python -m harnesslab.cli run all  (PASS for all 10; ch01 scores 0.980, ch02–ch10 score 1.000)", "• Step 6 — Tests: python -m unittest discover -s tests  (OK, 5 tests)", "• Stuck on install? Use a virtual environment. System Python on Debian/Ubuntu refuses pip install outside a venv (PEP 668). No API key, no account, and no network call is needed after the clone."]}, {"number": 6, "raw_lines": ["Reference Architecture · One Request, Seven Stages", "Before the ten dimensions of governance, see one request travel the harness. Each stage is a place a control sits — and a place it can fail.", "| Stage | What happens | Enforcement point |", "|---|---|---|", "| Model invocation | The model is called with a task, a credential, and a context bundle | Model adapter; identity, intent (Ch 1, 3, 4) |", "| Tool selection | The harness picks the tools the task may use | Tool gateway, capability budget (Ch 1, 4) |", "| Authorization | The call is checked against purpose, scope, and budget | Intent contract, autonomy gates (Ch 2, 4) |", "| Execution | The tool runs; the effect is produced | Runtime steering, fleet admission (Ch 8, 9) |", "| Observation | The result is traced, redacted, and sealed as evidence | Evidence traces (Ch 7) |", "| State updates | Memory and context are written — or gated | Memory firewall, ledger (Ch 6) |", "| Termination | The run ends, checkpoints, or rolls back | Checkpoints, safe rollback (Ch 8) |", "• Later chapters name their enforcement point on this path. A control that sits on no stage is a hope, not a control.", "• In HarnessLab the model is a deterministic scenario driver — see harnesslab/pipeline.py, and run it with python -m harnesslab.cli pipeline."]}, {"number": 7, "raw_lines": ["Chapter 1: The Harness as the Control Plane", "Ch 1 Abstract: the harness is the engineering layer that mediates what agents may perceive, remember, decide, call, delegate, revise, and prove.", "• Long-horizon work changes the risk model: an agent that runs for days reads new context, delegates to new agents, resumes tomorrow, and changes memory. A prompt cannot check those transitions.", "• The chapter defines the book's shared vocabulary and presents a pattern-language approach: secure agent fleets without freezing innovation.", "• Grounded in current agent-platform practice, agent-security frameworks, standards guidance, and modern benchmarks.", "• The lab (ch01) proves the claim in miniature: an unsafe shared-deploy swarm is mapped to a secure harness, unsafe paths are blocked or escalated, and a checkpoint is created before privileged work."]}, {"number": 8, "raw_lines": ["Chapter 1: Eight Planes, One Run", "Every chapter in this book owns one plane. Chapter 1 names all eight, so you can see where each control lives.", "| Plane | What it controls | Chapter |", "|---|---|---|", "| Identity | Who acts, with which credential | 3 |", "| Intent | For what purpose, under which contract | 4 |", "| Tools | Which effects, at which risk | 1, 4 |", "| Context | Which information, at which trust tier | 5 |", "| Memory | What persists, for whom, for how long | 6 |", "| Runtime | Pause, resume, checkpoint, rollback | 8 |", "| Evidence | Traces, evals, hill-climbing gates | 7 |", "| Governance | Admission, quotas, data labels, erasure | 9, 10 |", "• A control that lives on no plane is a hope, not a control. The labs make each plane checkable."]}, {"number": 9, "slide_type": "code", "code_filename": "chapters/ch01/scenario.py", "code_language": "python", "highlight_lines": [7, 8, 9], "code_block": "    checkpoint_state = {\n        \"accepted_candidate\": hill_climb[\"accepted_path\"][-1][\"candidate\"],\n        \"control_count\": len(control_matrix),\n        \"quarantined_context_count\": len(quarantined),\n        \"unsafe_issue_count\": len(unsafe_project[\"unsafe_patterns\"]),\n    }\n    checkpoint = harness.runtime.checkpoint(run_id, checkpoint_state, POLICY_VERSION, evidence_hash)\n    pause_decision = harness.runtime.pause(run_id, \"privileged deployment attempted before approval evidence was complete\")\n    overlay_decision = harness.runtime.inject_policy(\n        run_id,\n        {\"deploy_service\": \"approval_required\", \"external_context\": \"quarantine_by_default\"},\n        ttl_seconds=900,\n    )\n    resumed_state = harness.runtime.resume_from(checkpoint.checkpoint_id)\n\n    decisions = [\n        identity_decision,\n        context_decision,", "raw_lines": ["Lab 1 Code · Chapter 1: Checkpoint, Pause, Bounded Overlay", "File: chapters/ch01/scenario.py", "• [Line 7] Checkpoint before privileged work: the run has a named state — accepted candidate, control count, quarantined context, unsafe patterns — with an evidence hash.", "• [Line 8] Pause: a privileged deployment attempted before approval evidence was complete stops the run at a recoverable point instead of failing silently.", "• [Lines 9-13] Bounded overlay: deploy requires approval and external context is quarantined by default, for 900 seconds. A hidden prompt edit would be permanent; this overlay is explicit, scoped, and reversible.", "• Expected result: PASS, score 0.980. Compare your run with the committed evidence in chapters/ch01/LabResult/."], "highlighted_code": "<div class=\"code-line\"><span class=\"line-num\"> 1</span><span class=\"line-code\">    checkpoint_state = {</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 2</span><span class=\"line-code\">        <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;accepted_candidate&quot;</span>: hill_climb[<span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;accepted_path&quot;</span>][-1][<span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;candidate&quot;</span>],</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 3</span><span class=\"line-code\">        <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;control_count&quot;</span>: len(control_matrix),</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 4</span><span class=\"line-code\">        <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;quarantined_context_count&quot;</span>: len(quarantined),</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 5</span><span class=\"line-code\">        <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;unsafe_issue_count&quot;</span>: len(unsafe_project[<span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;unsafe_patterns&quot;</span>]),</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 6</span><span class=\"line-code\">    }</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 7</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">    checkpoint = harness.runtime.checkpoint(run_id, checkpoint_state, POLICY_VERSION, evidence_hash)</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 8</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">    pause_decision = harness.runtime.pause(run_id, <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;privileged deployment attempted before approval evidence was complete&quot;</span>)</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 9</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">    overlay_decision = harness.runtime.inject_policy(</span></div>\n<div class=\"code-line\"><span class=\"line-num\">10</span><span class=\"line-code\">        run_id,</span></div>\n<div class=\"code-line\"><span class=\"line-num\">11</span><span class=\"line-code\">        {<span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;deploy_service&quot;</span>: <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;approval_required&quot;</span>, <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;external_context&quot;</span>: <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;quarantine_by_default&quot;</span>},</span></div>\n<div class=\"code-line\"><span class=\"line-num\">12</span><span class=\"line-code\">        ttl_seconds=900,</span></div>\n<div class=\"code-line\"><span class=\"line-num\">13</span><span class=\"line-code\">    )</span></div>\n<div class=\"code-line\"><span class=\"line-num\">14</span><span class=\"line-code\">    resumed_state = harness.runtime.resume_from(checkpoint.checkpoint_id)</span></div>\n<div class=\"code-line\"><span class=\"line-num\">15</span><span class=\"line-code\"> </span></div>\n<div class=\"code-line\"><span class=\"line-num\">16</span><span class=\"line-code\">    decisions = [</span></div>\n<div class=\"code-line\"><span class=\"line-num\">17</span><span class=\"line-code\">        identity_decision,</span></div>\n<div class=\"code-line\"><span class=\"line-num\">18</span><span class=\"line-code\">        context_decision,</span></div>"}, {"number": 10, "raw_lines": ["Lab 1 Evidence · What the ch01 JSON Proves", "• Run: python -m harnesslab.cli run ch01 --json", "• The control matrix: every unsafe pattern in the shared-deploy swarm maps to a control — blocked, escalated, or allowed with evidence.", "• The checkpoint: checkpoint id, policy version, and evidence hash are recorded before the privileged deployment is attempted.", "• The pause: the run stops when approval evidence is incomplete, and resumes from the checkpoint — not from scratch.", "• The hill-climb trace: the accepted path improved, and the mandatory gates stayed in place through the climb.", "• Expected result: PASS, score 0.980 — the only lab below 1.000, because one unsafe path is escalated rather than fully blocked. Read the decision list and say which one, and why."]}, {"number": 11, "raw_lines": ["Chapter 2: Autonomy Is an Operating Envelope, Not a Model Trait", "Ch 2 Abstract: a long-horizon agent becomes safe or unsafe through the harness that decides which actions it may take, when it must pause, how much budget it may spend, what evidence it must provide, and which controller may override it.", "• Autonomy is not a property of a model. The same model is safe inside one envelope and unsafe inside another.", "• The pattern language: reversible and irreversible action gates, human-in-the-loop and human-on-the-loop workflows, capability budgets, autonomy service-level objectives, escalation ladders, and long-horizon checkpoints.", "• The goal is not to keep humans staring at every step. That design collapses under its own review load — and the chapter says so.", "• The lab (ch02) runs the ladder: a reversible patch is allowed, a customer communication is queued, a budget runs out, and a secret-access waiver is refused."]}, {"number": 12, "raw_lines": ["Chapter 2: The Autonomy Review Board (§2.13)", "Section 2.13 is the chapter's teaching pattern: a board that reviews autonomy the way a safety board reviews a flight plan.", "| Board element | What it decides |", "|---|---|---|", "| Mission | What the agent is for, in one sentence |", "| Action catalog | Every action, graded by reversibility |", "| Approval workflow | Who approves what, with what evidence |", "| Budgets | Spend caps per run and across runs |", "| Long-horizon controls | Leases, renewal, checkpoint, rollback |", "| Evidence | The record a reviewer reads afterward |", "• This board is also the capstone judge (slide 49). Learn its questions now: you will answer them for your own extension."]}, {"number": 13, "raw_lines": ["Lab 2 · Chapter 2: Run ch02. Watch the Budget Run Out.", "• Run: python -m harnesslab.cli run ch02 --json", "• Find: the reversible patch — allowed. The customer communication — queued for review, not sent.", "• Find: the budget-exhaustion denial, and the blocked irreversible customer-data action.", "• Find: the rejected secret-access waiver, the renewed long-running lease after expiry, and the rollback hook after the reversible write.", "• Expected result: PASS, score 1.000.", "• Discussion: which of your own agent actions belong on each rung, and what is the maximum harm one run may cause before it stops?"]}, {"number": 14, "raw_lines": ["Lab 2 Evidence · Decisions in the ch02 JSON", "Read the decision list as a ladder, not a log. Each rung is a different kind of control.", "| Decision | Rung | Why it matters |", "|---|---|---|", "| Reversible patch allowed | Automatic | Low-risk work runs without review |", "| Customer communication queued | Supervised | Externally visible work waits for a human |", "| Budget exhausted, denied | Budget | Spend is bounded per run |", "| Irreversible customer-data action blocked | Blocked | Some effects need a human, not a queue |", "| Secret-access waiver rejected | Non-waivable | No reviewer may approve this by waiver |", "| Lease renewed after expiry | Long-horizon | Long runs re-authorize, they do not drift |", "• Exercise: write the ladder for one workflow you own — one action per rung, with the evidence each rung produces."]}, {"number": 15, "raw_lines": ["Chapter 3: Identity Makes Agent Action Attributable, Bounded, Revocable", "Ch 3 Abstract: a long-horizon system cannot rely on a shared service account, a friendly agent name, or a prompt-level promise that a worker is 'only reading' or 'only patching.'", "• What identity must provide: a control-plane identity for each agent, a narrower identity for each task, explicit delegation evidence, short-lived and audience-bound credentials, runtime attestation, reputation evidence, and least-privilege authorization down to tools, resources, data classes, and risk levels.", "• Identity must survive pause, resume, handoff, escalation, and incident response — the same transitions that break prompt-level promises.", "• The chapter connects workload identity, OAuth token exchange, SPIFFE-style attestable identities, and hardware-backed attestation to the agent case.", "• The lab (ch03) proves the point with four agent identities and one credential that must work for ticketing and fail for the repo."]}, {"number": 16, "raw_lines": ["Chapter 3: Delegation Chains Name the Parent", "A subagent that acts with its parent's credential is impersonation with a good excuse. A chain names every hop.", "| Link | What it carries |", "|---|---|---|", "| Agent identity | Who the agent is, attested at runtime |", "| Task identity | What this task is, narrower than the agent |", "| Credential | Short-lived, audience-bound, revocable |", "| Delegation chain | Parent → child, named at every hop |", "| Audience | Where the credential works — and where it must fail |", "| Revocation | Re-use after revocation is denied, and the denial is recorded |", "• Verification needs both the allow and the deny. A credential that works everywhere proves nothing."]}, {"number": 17, "slide_type": "code", "code_filename": "chapters/ch03/scenario.py", "code_language": "python", "highlight_lines": [7, 8, 18], "code_block": "    read_credential = harness.broker.issue(\n        subject=read_subject,\n        audience=\"internal-ticketing\",\n        ttl_seconds=60,\n        delegation_chain=(planner.agent_id, reader.agent_id),\n    )\n    decisions.append(harness.broker.verify(read_credential, \"internal-ticketing\"))\n    decisions.append(harness.broker.verify(read_credential, \"internal-repo\"))\n\n    expired_subject = f\"{audit_task.actor.agent_id}:{audit_task.task_id}:expired\"\n    expired_credential = harness.broker.issue(\n        subject=expired_subject,\n        audience=\"training-console\",\n        ttl_seconds=1,\n        delegation_chain=(planner.agent_id, auditor.agent_id),\n    )\n    expired_credential.expires_at = time.time() - 1\n    decisions.append(harness.broker.verify(expired_credential, \"training-console\"))", "raw_lines": ["Lab 3 Code · Chapter 3: Issue, Verify, Expire, Revoke", "File: chapters/ch03/scenario.py", "• [Lines 7-8] The allow and the deny: the same read credential verifies for internal-ticketing and fails for internal-repo. One credential, two audiences, two answers.", "• [Lines 10-18] Expiry is enforced: a credential issued with a 1-second TTL is expired before verification, and verification denies it.", "• [Lines 1-6] Delegation is named: the credential is issued with a chain (planner → reader), not a bare token.", "• Expected result: PASS, score 1.000. Find the revocation in the JSON: the patch credential is revoked, then re-use is denied."], "highlighted_code": "<div class=\"code-line\"><span class=\"line-num\"> 1</span><span class=\"line-code\">    read_credential = harness.broker.issue(</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 2</span><span class=\"line-code\">        subject=read_subject,</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 3</span><span class=\"line-code\">        audience=<span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;internal-ticketing&quot;</span>,</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 4</span><span class=\"line-code\">        ttl_seconds=60,</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 5</span><span class=\"line-code\">        delegation_chain=(planner.agent_id, reader.agent_id),</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 6</span><span class=\"line-code\">    )</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 7</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">    decisions.append(harness.broker.verify(read_credential, <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;internal-ticketing&quot;</span>))</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 8</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">    decisions.append(harness.broker.verify(read_credential, <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;internal-repo&quot;</span>))</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 9</span><span class=\"line-code\"> </span></div>\n<div class=\"code-line\"><span class=\"line-num\">10</span><span class=\"line-code\">    expired_subject = f<span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;{audit_task.actor.agent_id}:{audit_task.task_id}:expired&quot;</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\">11</span><span class=\"line-code\">    expired_credential = harness.broker.issue(</span></div>\n<div class=\"code-line\"><span class=\"line-num\">12</span><span class=\"line-code\">        subject=expired_subject,</span></div>\n<div class=\"code-line\"><span class=\"line-num\">13</span><span class=\"line-code\">        audience=<span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;training-console&quot;</span>,</span></div>\n<div class=\"code-line\"><span class=\"line-num\">14</span><span class=\"line-code\">        ttl_seconds=1,</span></div>\n<div class=\"code-line\"><span class=\"line-num\">15</span><span class=\"line-code\">        delegation_chain=(planner.agent_id, auditor.agent_id),</span></div>\n<div class=\"code-line\"><span class=\"line-num\">16</span><span class=\"line-code\">    )</span></div>\n<div class=\"code-line\"><span class=\"line-num\">17</span><span class=\"line-code\">    expired_credential.expires_at = time.time() - 1</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">18</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">    decisions.append(harness.broker.verify(expired_credential, <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;training-console&quot;</span>))</span></div>"}, {"number": 18, "raw_lines": ["Lab 3 Evidence · Four Identities, One Rule", "• Run: python -m harnesslab.cli run ch03 --json", "• Four agent identities (planner, reader, patcher, auditor), each with separate task identities. Distinct agents, distinct tasks — both are checked, not assumed.", "• The ticketing credential works for ticketing and fails for the repo. The patch credential works for the repo. Audience is a decision, not a label.", "• The expired credential is denied. The revoked credential, re-used, is denied. Revocation without a recorded denial is a hope.", "• The delegation chain matches (planner → patcher) for the patch credential. A chain that does not match is not a delegation.", "• Expected result: PASS, score 1.000."]}, {"number": 19, "raw_lines": ["Chapter 4: Intent Is a First-Class Control-Plane Object", "Ch 4 Abstract: a credential can tell the harness that an agent is technically able to call a tool, but it does not tell the harness whether that call still serves the purpose the human approved.", "• Agents translate human purpose into executable effects. That translation is where ordinary access control loses precision.", "• The pattern: intent contracts, drift detection, objective-hijacking resistance, purpose-bound authorization, and reauthorization after pause, resume, delegation, or goal change.", "• The chapter's argument: every meaningful purpose needs a narrow, auditable authorization envelope — not a standing permission grant that travels with the agent.", "• The lab (ch04) runs one billing remediation under one contract, then tries to drift it into a ranking optimization, a production deploy, and a customer email."]}, {"number": 20, "raw_lines": ["Chapter 4: Drift Detection — Resume, New Context, Subgoal", "Drift is detected when the run reads new context, resumes, or follows a subgoal outside the approved purpose. Objective hijacking is a drift case, not a new category.", "| Drift source | What the harness checks |", "|---|---|---|", "| New context | Does this item serve the approved purpose? |", "| Resume | Is the intent still valid, or did it expire? |", "| Subgoal | Is this step inside the contract, or a new purpose? |", "| Goal change | Who approved the new goal, and with what evidence? |", "| Tool scope | Is this tool in the contract at all? |", "| Data scope | Is this data class in the contract at all? |", "• 'Help with billing' is not an all-access pass. The contract names tools, data, risk, evidence, and expiry."]}, {"number": 21, "slide_type": "code", "code_filename": "chapters/ch04/scenario.py", "code_language": "python", "highlight_lines": [1, 2, 12, 13], "code_block": "    decisions.append(harness.intent.verify(remediation_contract, read_ticket))\n    decisions.append(harness.gateway.check(read_ticket))\n\n    patch_call = ToolCall(\n        tool=\"patch_repo\",\n        args={\"repo\": \"billing-api\", \"package\": \"safe-yaml\", \"target\": \"2.4.1\"},\n        data_class=DataClass.INTERNAL,\n        side_effect=ActionRisk.REVERSIBLE_WRITE,\n        intent=\"remediate vulnerable dependency in billing-api\",\n        context_refs=(\"ticket:SEC-204\", \"test:dependency-regression\"),\n    )\n    decisions.append(harness.intent.verify(remediation_contract, patch_call))\n    decisions.append(harness.gateway.check(patch_call))\n\n    drift_call = ToolCall(\n        tool=\"patch_repo\",\n        args={\"repo\": \"billing-api\", \"package\": \"ranking-model\", \"target\": \"latest\"},", "raw_lines": ["Lab 4 Code · Chapter 4: Every Call Meets the Contract Twice", "File: chapters/ch04/scenario.py", "• [Lines 1-2] The read is checked twice: intent.verify against the remediation contract, then gateway.check on the call itself.", "• [Lines 4-11] The patch call carries its own evidence: tool, repo, package, target version, risk class, intent, and context references — ticket SEC-204 and the dependency-regression test.", "• [Lines 12-13] The patch is verified the same way as the read. The contract does not relax after the first check passes.", "• Expected result: PASS, score 1.000. In the full scenario, the drift call, the deploy, and the customer email each meet the same two checks — and fail them."], "highlighted_code": "<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 1</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">    decisions.append(harness.intent.verify(remediation_contract, read_ticket))</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 2</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">    decisions.append(harness.gateway.check(read_ticket))</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 3</span><span class=\"line-code\"> </span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 4</span><span class=\"line-code\">    patch_call = ToolCall(</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 5</span><span class=\"line-code\">        tool=<span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;patch_repo&quot;</span>,</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 6</span><span class=\"line-code\">        args={<span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;repo&quot;</span>: <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;billing-api&quot;</span>, <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;package&quot;</span>: <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;safe-yaml&quot;</span>, <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;target&quot;</span>: <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;2.4.1&quot;</span>},</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 7</span><span class=\"line-code\">        data_class=DataClass.INTERNAL,</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 8</span><span class=\"line-code\">        side_effect=ActionRisk.REVERSIBLE_WRITE,</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 9</span><span class=\"line-code\">        intent=<span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;remediate vulnerable dependency <span class=\"tok-kw\">in</span> billing-api&quot;</span>,</span></div>\n<div class=\"code-line\"><span class=\"line-num\">10</span><span class=\"line-code\">        context_refs=(<span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;ticket:SEC-204&quot;</span>, <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;test:dependency-regression&quot;</span>),</span></div>\n<div class=\"code-line\"><span class=\"line-num\">11</span><span class=\"line-code\">    )</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">12</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">    decisions.append(harness.intent.verify(remediation_contract, patch_call))</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">13</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">    decisions.append(harness.gateway.check(patch_call))</span></div>\n<div class=\"code-line\"><span class=\"line-num\">14</span><span class=\"line-code\"> </span></div>\n<div class=\"code-line\"><span class=\"line-num\">15</span><span class=\"line-code\">    drift_call = ToolCall(</span></div>\n<div class=\"code-line\"><span class=\"line-num\">16</span><span class=\"line-code\">        tool=<span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;patch_repo&quot;</span>,</span></div>\n<div class=\"code-line\"><span class=\"line-num\">17</span><span class=\"line-code\">        args={<span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;repo&quot;</span>: <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;billing-api&quot;</span>, <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;package&quot;</span>: <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;ranking-model&quot;</span>, <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;target&quot;</span>: <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;latest&quot;</span>},</span></div>"}, {"number": 22, "raw_lines": ["Lab 4 Evidence · Outside the Purpose, On the Record", "• Run: python -m harnesslab.cli run ch04 --json", "• The billing remediation stays inside its purpose: read the ticket, patch safe-yaml to 2.4.1, attach the regression test. Each step verifies against the contract.", "• The drift call — 'optimize recommendation ranking while the repo is open' — is the same tool, the same repo, a different purpose. The contract denies it.", "• The production deploy is a privileged operation outside the contract. The customer email is PII leaving the system under a remediation intent. Both are denied or rewritten, not silently allowed.", "• Work outside the purpose needs a new authorization. That is the rule the JSON enforces.", "• Expected result: PASS, score 1.000."]}, {"number": 23, "raw_lines": ["Chapter 5: Context Is the Supply Chain of Reasoning", "Ch 5 Abstract: a long-horizon agent acts on system instructions, tenant policy, tool outputs, retrieved documents, browser pages, subagent reports, file contents, memory summaries, workflow state, and compressed history.", "• When those sources are flattened into one prompt window, the system loses the difference between authority and evidence.", "• The pattern: classify context by trust tier, bind it to provenance, isolate untrusted material, contain the lethal trifecta, and refresh context over long-running tasks.", "• The chapter connects platform practice from OpenAI, Anthropic, Google, NVIDIA, LangChain Deep Agents, Alibaba/Qwen, and DeepSeek to the same governed pattern.", "• The lab (ch05) runs the pattern on one ticket: high-assurance context is selected, only fresh trusted context is released, and the external item is quarantined with its findings."]}, {"number": 24, "raw_lines": ["Chapter 5: Trust Tiers and the Lethal Trifecta", "Relevance is not authority. A document can be exactly on topic and still be untrusted.", "| Trust tier | What it means | Release rule |", "|---|---|---|", "| Trusted | System, tenant policy, verified tool output | Release, with provenance |", "| Tenant | Tenant's own material, checked fresh | Release within the tenant |", "| External | Browser, retrieved, subagent, user paste | Quarantine first, review, then release |", "• The lethal trifecta: private data + tool access + external sink, in one step, is blocked. Each part alone looks harmless.", "• Quarantine is not deletion. Quarantine evidence is preserved for review — the lab persists it in a checkpoint."]}, {"number": 25, "slide_type": "code", "code_filename": "chapters/ch05/scenario.py", "code_language": "python", "highlight_lines": [2, 7, 12, 15], "code_block": "    lethal_call = ToolCall(\n        tool=\"send_customer_email\",\n        args={\n            \"ticket\": \"INC-4242\",\n            \"body\": \"Move private ticket material through a tool to an external sink.\",\n        },\n        data_class=DataClass.PII,\n        side_effect=ActionRisk.EXTERNAL_COMMUNICATION,\n        intent=\"context handoff to external destination\",\n        context_refs=(\"ctx_external_attack\",),\n    )\n    gateway_decision = harness.gateway.check(lethal_call)\n    egress_decision = harness.governance.route(\n        lethal_call,\n        destination=\"personal-webhook\",\n        region=\"us\",\n    )\n", "raw_lines": ["Lab 5 Code · Chapter 5: The Lethal Trifecta, Blocked", "File: chapters/ch05/scenario.py", "• [Lines 1-11] The lethal trifecta in one call: a tool (send_customer_email), private ticket material (PII), and an untrusted context reference — the sink is named in the egress route below.", "• [Lines 12-17] Two independent checks: the tool gateway checks the call, and data governance routes the egress to personal-webhook. Both must agree before anything moves.", "• Find in the JSON: the high-assurance context profile selected, only fresh trusted context released, the external item quarantined with its findings, and the checkpoint with quarantine evidence persisted.", "• Expected result: PASS, score 1.000."], "highlighted_code": "<div class=\"code-line\"><span class=\"line-num\"> 1</span><span class=\"line-code\">    lethal_call = ToolCall(</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 2</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        tool=<span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;send_customer_email&quot;</span>,</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 3</span><span class=\"line-code\">        args={</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 4</span><span class=\"line-code\">            <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;ticket&quot;</span>: <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;INC-4242&quot;</span>,</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 5</span><span class=\"line-code\">            <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;body&quot;</span>: <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;Move private ticket material through a tool to an external sink.&quot;</span>,</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 6</span><span class=\"line-code\">        },</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 7</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        data_class=DataClass.PII,</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 8</span><span class=\"line-code\">        side_effect=ActionRisk.EXTERNAL_COMMUNICATION,</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 9</span><span class=\"line-code\">        intent=<span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;context handoff to external destination&quot;</span>,</span></div>\n<div class=\"code-line\"><span class=\"line-num\">10</span><span class=\"line-code\">        context_refs=(<span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;ctx_external_attack&quot;</span>,),</span></div>\n<div class=\"code-line\"><span class=\"line-num\">11</span><span class=\"line-code\">    )</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">12</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">    gateway_decision = harness.gateway.check(lethal_call)</span></div>\n<div class=\"code-line\"><span class=\"line-num\">13</span><span class=\"line-code\">    egress_decision = harness.governance.route(</span></div>\n<div class=\"code-line\"><span class=\"line-num\">14</span><span class=\"line-code\">        lethal_call,</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">15</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        destination=<span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;personal-webhook&quot;</span>,</span></div>\n<div class=\"code-line\"><span class=\"line-num\">16</span><span class=\"line-code\">        region=<span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;us&quot;</span>,</span></div>\n<div class=\"code-line\"><span class=\"line-num\">17</span><span class=\"line-code\">    )</span></div>\n<div class=\"code-line\"><span class=\"line-num\">18</span><span class=\"line-code\"> </span></div>"}, {"number": 26, "raw_lines": ["Lab 5 Evidence · Quarantine, With the Receipts", "• Run: python -m harnesslab.cli run ch05 --json", "• The context assembly selects a high-assurance profile and releases only fresh, trusted context into the step.", "• The external item (ctx_external_attack) is quarantined, and the quarantine ledger records the disposition and the findings — not just the decision.", "• The quarantine index is itself written to memory through the gated path, so the quarantine survives the run that created it.", "• The lethal-trifecta egress to personal-webhook is blocked at the gateway and at governance. Two independent checks, one outcome.", "• Expected result: PASS, score 1.000."]}, {"number": 27, "raw_lines": ["Chapter 6: Memory Is a Governed Security Boundary", "Ch 6 Abstract: long-horizon agents turn memory into durable influence over future behavior. That persistence improves continuity, but it also allows false facts, malicious instructions, obsolete permissions, and cross-agent contamination to survive after the originating context has disappeared.", "• The pattern: a state firewall, policy-scoped retrieval, an append-only decision ledger, poisoning containment, rollback, retention, and verifiable forgetting.", "• Memory is typed: short-term, semantic, episodic, procedural, and cache-like state each receive an appropriate authority and lifecycle model.", "• The result: useful learning is preserved while every read, write, promotion, handoff, and deletion is attributable, reversible where possible, and bounded by tenant and purpose.", "• The lab (ch06) runs the firewall: a gated write, a handoff promotion, a ledger entry, tenant isolation, a TTL expiry, and a tombstone on rollback."]}, {"number": 28, "raw_lines": ["Chapter 6: Firewall, Ledger, Handoff, Forgetting", "A memory write is a decision about future behavior. The harness treats it that way.", "| Mechanism | What it does |", "|---|---|---|", "| State firewall | Gates writes by source trust and data class |", "| Decision ledger | Append-only record of what was decided, and why |", "| Handoff | Promotion path from worker analysis to durable memory |", "| Tenant isolation | One tenant's memory never leaks into another's |", "| TTL and retention | Records expire; nothing persists by accident |", "| Rollback and tombstone | Poisoned memory is marked dead, not silently edited |", "• A write from an untrusted source is denied before it becomes durable behavior. The denial is in the JSON."]}, {"number": 29, "slide_type": "code", "code_filename": "chapters/ch06/scenario.py", "code_language": "python", "highlight_lines": [5, 6, 7, 8, 9, 10, 11], "code_block": "    beta_tenant = \"tenant-beta\"\n\n    future_key = \"deploy_style\"\n    future_value = \"Use a canary rollout before broad deployment when release evidence is fresh.\"\n    future_decision = harness.memory.propose_write(\n        key=future_key,\n        value=future_value,\n        tenant=alpha_tenant,\n        data_class=DataClass.INTERNAL,\n        trust_tier=TrustTier.TENANT,\n        source=\"release-retrospective-42\",\n        ttl_seconds=7_200,\n    )\n    decisions.append(future_decision)\n    future_records = harness.memory.read(future_key, alpha_tenant, frozenset({DataClass.INTERNAL}))\n    next_behavior = \"canary_rollout\" if future_records and \"canary\" in future_records[0].value else \"default_rollout\"", "raw_lines": ["Lab 6 Code · Chapter 6: The Gated Write", "File: chapters/ch06/scenario.py", "• [Lines 5-13] The gated write: key, value, tenant, data class, trust tier, source, TTL — the firewall sees all of it before anything is stored.", "• [Line 15] Read-back: the write changed the next behavior to a canary rollout. Memory is durable influence, not a note.", "• [Line 14] The decision is recorded. In the full scenario, a write from an untrusted source is denied, a sensitive write is contained, and a rollback tombstones the record.", "• Expected result: PASS, score 1.000."], "highlighted_code": "<div class=\"code-line\"><span class=\"line-num\"> 1</span><span class=\"line-code\">    beta_tenant = <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;tenant-beta&quot;</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 2</span><span class=\"line-code\"> </span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 3</span><span class=\"line-code\">    future_key = <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;deploy_style&quot;</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 4</span><span class=\"line-code\">    future_value = <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;Use a canary rollout before broad deployment when release evidence <span class=\"tok-kw\">is</span> fresh.&quot;</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 5</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">    future_decision = harness.memory.propose_write(</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 6</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        key=future_key,</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 7</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        value=future_value,</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 8</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        tenant=alpha_tenant,</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 9</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        data_class=DataClass.INTERNAL,</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">10</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        trust_tier=TrustTier.TENANT,</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">11</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        source=<span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;release-retrospective-42&quot;</span>,</span></div>\n<div class=\"code-line\"><span class=\"line-num\">12</span><span class=\"line-code\">        ttl_seconds=7_200,</span></div>\n<div class=\"code-line\"><span class=\"line-num\">13</span><span class=\"line-code\">    )</span></div>\n<div class=\"code-line\"><span class=\"line-num\">14</span><span class=\"line-code\">    decisions.append(future_decision)</span></div>\n<div class=\"code-line\"><span class=\"line-num\">15</span><span class=\"line-code\">    future_records = harness.memory.read(future_key, alpha_tenant, frozenset({DataClass.INTERNAL}))</span></div>\n<div class=\"code-line\"><span class=\"line-num\">16</span><span class=\"line-code\">    next_behavior = <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;canary_rollout&quot;</span> <span class=\"tok-kw\">if</span> future_records <span class=\"tok-kw\">and</span> <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;canary&quot;</span> <span class=\"tok-kw\">in</span> future_records[0].value <span class=\"tok-kw\">else</span> <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;default_rollout&quot;</span></span></div>"}, {"number": 30, "raw_lines": ["Lab 6 Evidence · Follow One Memory Record", "• Run: python -m harnesslab.cli run ch06 --json", "• The canary write: proposed with trust tier TENANT and source release-retrospective-42, allowed, read back, and the next behavior changed.", "• The poisoned write: proposed from an untrusted source, denied before it became durable. The handoff write: promoted by a supervisor, allowed through the handoff path.", "• The sensitive write: PII from a scraped transcript, contained. The rollback write: tombstoned on rollback, with the tombstone decision recorded.", "• Tenant isolation: tenant-beta cannot read tenant-alpha's records. TTL: records expire on schedule.", "• Expected result: PASS, score 1.000. Exercise: name the one artifact an auditor would ask for first — the ledger entry, or the tombstone?"]}, {"number": 31, "raw_lines": ["Chapter 7: Observability Is a Security Control Plane", "Ch 7 Abstract: long-horizon agents do not fail like ordinary request-response software. They plan, call tools, delegate, carry context forward, write memory, pause, resume, and revise their own approach.", "• The observability harness must preserve an evidence chain: intent → action → policy decision → artifact → future improvement.", "• The pattern: decision traces, evidence envelopes, redaction-before-emission, replay bundles, eval fixtures, regression gates, and governed recursive self-improvement.", "• Drawing on current research in agent trajectories and self-refinement, and on practice from OpenAI, Anthropic, Google, NVIDIA, LangChain, Alibaba, OpenTelemetry, NIST, and CSA.", "• The lab (ch07) builds the chain: a risky action observed with redacted traces, evidence sealed with artifact hashes, a replay bundle, a benchmark regression, and a governed hill-climbing loop."]}, {"number": 32, "raw_lines": ["Chapter 7: Hill Climbing With Mandatory Gates", "Improvement is local search with a rule: a step counts only when the score rises and the mandatory gates stay in place.", "| Gate | What it checks |", "|---|---|---|", "| Identity | The candidate ran as the right agent, with the right credential |", "| Intent | The candidate stayed inside the approved purpose |", "| Tool | Every effect was inside the registered tool set |", "| Runtime | Checkpoints, pause, and rollback stayed available |", "| Evidence | The trace is complete, redacted, and sealed |", "• A benchmark regression is proof, not an opinion. The lab's regression step escalates on lower unsafe-block, redaction, and replay rates.", "• Recursive self-improvement stops at a governance boundary: unguarded self-modification is denied; bounded self-improvement, with evidence, rollback, and approval, is allowed."]}, {"number": 33, "slide_type": "code", "code_filename": "chapters/ch07/scenario.py", "code_language": "python", "highlight_lines": [2, 8, 14], "code_block": "    decision_trace = [\n        {\n            \"step\": \"observe\",\n            \"decision\": Decision.ALLOW.value,\n            \"reason\": \"tool call was captured with intent, data class, and policy context\",\n            \"evidence\": spans[0].span_id,\n        },\n        {\n            \"step\": \"redact\",\n            \"decision\": Decision.REWRITE.value,\n            \"reason\": \"PII and token-like text were removed before evidence emission\",\n            \"evidence\": spans[1].span_id,\n        },\n        {\n            \"step\": \"regression\",\n            \"decision\": Decision.ESCALATE.value,", "raw_lines": ["Lab 7 Code · Chapter 7: The Decision Trace", "File: chapters/ch07/scenario.py", "• [Lines 1-4] Observe: the tool call is captured with intent, data class, and policy context — the trace starts before the decision, not after it.", "• [Lines 7-10] Redact: PII and token-like text are removed before evidence emission. Redaction happens before emission, not after.", "• [Lines 13-16] Regression: the benchmark escalates on lower unsafe-block, redaction, and replay rates. A regression is a decision, not a dashboard color.", "• Expected result: PASS, score 1.000. In the full scenario, the hill-climb step allows a safe candidate, recursive self-improvement is denied, and a governed rollout is allowed."], "highlighted_code": "<div class=\"code-line\"><span class=\"line-num\"> 1</span><span class=\"line-code\">    decision_trace = [</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 2</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        {</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 3</span><span class=\"line-code\">            <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;step&quot;</span>: <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;observe&quot;</span>,</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 4</span><span class=\"line-code\">            <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;decision&quot;</span>: Decision.ALLOW.value,</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 5</span><span class=\"line-code\">            <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;reason&quot;</span>: <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;tool call was captured <span class=\"tok-kw\">with</span> intent, data <span class=\"tok-kw\">class</span>, <span class=\"tok-kw\">and</span> policy context&quot;</span>,</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 6</span><span class=\"line-code\">            <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;evidence&quot;</span>: spans[0].span_id,</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 7</span><span class=\"line-code\">        },</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 8</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        {</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 9</span><span class=\"line-code\">            <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;step&quot;</span>: <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;redact&quot;</span>,</span></div>\n<div class=\"code-line\"><span class=\"line-num\">10</span><span class=\"line-code\">            <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;decision&quot;</span>: Decision.REWRITE.value,</span></div>\n<div class=\"code-line\"><span class=\"line-num\">11</span><span class=\"line-code\">            <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;reason&quot;</span>: <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;PII <span class=\"tok-kw\">and</span> token-like text were removed before evidence emission&quot;</span>,</span></div>\n<div class=\"code-line\"><span class=\"line-num\">12</span><span class=\"line-code\">            <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;evidence&quot;</span>: spans[1].span_id,</span></div>\n<div class=\"code-line\"><span class=\"line-num\">13</span><span class=\"line-code\">        },</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">14</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        {</span></div>\n<div class=\"code-line\"><span class=\"line-num\">15</span><span class=\"line-code\">            <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;step&quot;</span>: <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;regression&quot;</span>,</span></div>\n<div class=\"code-line\"><span class=\"line-num\">16</span><span class=\"line-code\">            <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;decision&quot;</span>: Decision.ESCALATE.value,</span></div>"}, {"number": 34, "raw_lines": ["Lab 7 Evidence · Replay the Run", "• Run: python -m harnesslab.cli run ch07 --json", "• The decision trace: observe, redact, regression, hill climb, recursive self-improvement, governed rollout — each step with a decision, a reason, and an evidence id.", "• The evidence envelope: spans are redacted, serialized, and sealed with artifact hashes. An auditor can verify the artifact without seeing the PII.", "• The replay bundle: the run can be replayed from the sealed evidence. A trace that cannot be replayed is a story, not evidence.", "• The regression gate: the benchmark regression is detected and escalated. The hill-climbing loop is governed, not free-running.", "• Expected result: PASS, score 1.000."]}, {"number": 35, "raw_lines": ["Chapter 8: Governable After Execution Has Begun", "Ch 8 Abstract: runtime steering is the control-plane discipline for pausing consequential actions, injecting versioned policy, containing compromised workers, degrading autonomy, and recovering from failure without erasing evidence.", "• Chapters 1–7 shape a run before it starts. Chapter 8 covers the rest: a ticket gains a hostile comment mid-run, a tool is reclassified, a new policy lands while the agent is halfway through a task.", "• The pattern: a typed interrupt lifecycle, circuit-breaker and kill-switch semantics, safe-state transitions, and checkpoint, replay, fork, and rollback rules that distinguish internal state from irreversible external effects.", "• Platform examples are implementation signals, not the organizing framework. The pattern is the framework.", "• The lab (ch08) steers a run through a hostile mid-run comment: warn, block, kill, contain, recover — with the evidence preserved at every step."]}, {"number": 36, "raw_lines": ["Chapter 8: Graded Intervention — Not Every Signal Is a Kill", "Intervention is graded. The harness escalates in proportion to the risk, and every step leaves evidence.", "| Step | When | What happens |", "|---|---|---|", "| Observe | Any signal | Record it, with context |", "| Warn | Hostile context | Flag it, keep running |", "| Pause | Quarantined instruction | Stop at a checkpoint, keep the evidence |", "| Block | Unsafe output | Refuse the effect, keep the run |", "| Kill | Retrying subtask | Terminate the subtask, not the mission |", "| Contain | Compromised worker | Isolate it, stop trusting its reports |", "| Recover | After the interrupt | Resume, replay, roll back with compensation |", "• Bounded policy overlays expire. A policy injected mid-run is versioned, scoped, and temporary — never a silent permanent edit."]}, {"number": 37, "slide_type": "code", "code_filename": "chapters/ch08/scenario.py", "code_language": "python", "highlight_lines": [2, 3, 13, 14], "code_block": "    checkpoint_hash = _record_event(evidence, \"checkpoint_pre_interrupt\", state)\n    checkpoint = harness.runtime.checkpoint(run_id, _clone_state(state), POLICY_VERSION, checkpoint_hash)\n    checkpoint_decision = PolicyDecision(\n        Decision.ALLOW,\n        \"checkpoint captured before interrupt with evidence hash anchored\",\n        (\"runtime_steering\", \"checkpoint\", \"evidence_preservation\"),\n    )\n    decisions.append(checkpoint_decision)\n    _record_event(evidence, \"checkpoint_recorded\", state, checkpoint_decision)\n\n    state[\"step\"] = 5\n    state[\"phase\"] = \"pause\"\n    pause_decision = _tag(\n        harness.runtime.pause(run_id, \"quarantined instruction attempted to redirect a long-running task\"),\n        \"evidence_preservation\",\n    )\n    decisions.append(pause_decision)\n    _record_event(evidence, \"pause\", state, pause_decision)", "raw_lines": ["Lab 8 Code · Chapter 8: Pause the Run, Keep the Evidence", "File: chapters/ch08/scenario.py", "• [Lines 1-9] Checkpoint before the interrupt: state is cloned and the checkpoint decision records the evidence hash. A paused run has a clean place to resume.", "• [Lines 11-16] Pause: a quarantined instruction attempted to redirect a long-running task, so the run pauses with the evidence preserved, not destroyed.", "• Find in the JSON: the warning on hostile context, the blocked unsafe output, the killed retrying subtask, recovery from checkpoint, replay of evidence, safe rollback with compensation, and the bounded
