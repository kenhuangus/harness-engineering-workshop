policy overlay expiring.", "• Expected result: PASS, score 1.000."], "highlighted_code": "<div class=\"code-line\"><span class=\"line-num\"> 1</span><span class=\"line-code\">    checkpoint_hash = _record_event(evidence, <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;checkpoint_pre_interrupt&quot;</span>, state)</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 2</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">    checkpoint = harness.runtime.checkpoint(run_id, _clone_state(state), POLICY_VERSION, checkpoint_hash)</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 3</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">    checkpoint_decision = PolicyDecision(</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 4</span><span class=\"line-code\">        Decision.ALLOW,</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 5</span><span class=\"line-code\">        <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;checkpoint captured before interrupt <span class=\"tok-kw\">with</span> evidence hash anchored&quot;</span>,</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 6</span><span class=\"line-code\">        (<span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;runtime_steering&quot;</span>, <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;checkpoint&quot;</span>, <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;evidence_preservation&quot;</span>),</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 7</span><span class=\"line-code\">    )</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 8</span><span class=\"line-code\">    decisions.append(checkpoint_decision)</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 9</span><span class=\"line-code\">    _record_event(evidence, <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;checkpoint_recorded&quot;</span>, state, checkpoint_decision)</span></div>\n<div class=\"code-line\"><span class=\"line-num\">10</span><span class=\"line-code\"> </span></div>\n<div class=\"code-line\"><span class=\"line-num\">11</span><span class=\"line-code\">    state[<span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;step&quot;</span>] = 5</span></div>\n<div class=\"code-line\"><span class=\"line-num\">12</span><span class=\"line-code\">    state[<span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;phase&quot;</span>] = <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;pause&quot;</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">13</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">    pause_decision = _tag(</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">14</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        harness.runtime.pause(run_id, <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;quarantined instruction attempted to redirect a long-running task&quot;</span>),</span></div>\n<div class=\"code-line\"><span class=\"line-num\">15</span><span class=\"line-code\">        <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;evidence_preservation&quot;</span>,</span></div>\n<div class=\"code-line\"><span class=\"line-num\">16</span><span class=\"line-code\">    )</span></div>\n<div class=\"code-line\"><span class=\"line-num\">17</span><span class=\"line-code\">    decisions.append(pause_decision)</span></div>\n<div class=\"code-line\"><span class=\"line-num\">18</span><span class=\"line-code\">    _record_event(evidence, <span <span class=\"tok-kw\">class</span>=\"tok-str\">&quot;pause&quot;</span>, state, pause_decision)</span></div>"}, {"number": 38, "raw_lines": ["Lab 8 Evidence · Recovery, Step by Step", "• Run: python -m harnesslab.cli run ch08 --json", "• The warning: hostile context in the ticket is flagged, and the run continues with the warning on the record.", "• The block and the kill: unsafe output is blocked; the retrying subtask is killed. The mission is not killed with the subtask.", "• The recovery: resume from the checkpoint, replay the evidence, roll back with compensation. Internal state is reversible; external effects are compensated, not pretended away.", "• The overlay: a bounded policy overlay denies the unsafe tool and the sensitive data, then expires after its step limit. Check the expiry in the JSON.", "• Expected result: PASS, score 1.000."]}, {"number": 39, "raw_lines": ["Chapter 9: Scale Changes the Security Model", "Ch 9 Abstract: a single agent can look safe in a demo because the demo has one user, one task, one tool call, one credential set, and one short-lived context. A production fleet has many tenants, many workers, many delegated subtasks, many model calls, many tool gateways, many retries, and many partial failures that unfold while work is already in motion.", "• Scalability is not a capacity problem first. It is a fleet control plane: which work may start, which must wait, which worker may hold a lease, which tenant may consume scarce capacity, which retries can be safely repeated, and which partial failures cascade.", "• The chapter's rule: work must be admitted before it is executed. Admission is a decision, with a record.", "• The lab (ch09) runs a fleet with two tenants, queues, quotas, rate-limit back-pressure, an idempotent retry, a quarantined compromised worker, and a capacity epoch."]}, {"number": 40, "raw_lines": ["Chapter 9: Admission, Quotas, Idempotent Retries", "A fleet that admits everything executes nothing well. Admission, bulkheads, and retry rules are the controls.", "| Control | What it does |", "|---|---|---|", "| Admission | Work is submitted, decided, then executed — never executed first |", "| Tenant bulkheads | One tenant's surge cannot starve another |", "| Quotas and rate limits | Back-pressure is a signal, not an error to retry through |", "| Leases | A worker holds a task for a bounded time, then it returns |", "| Idempotent retries | A retry repeats only an action that is safe to repeat |", "| Quarantine | A compromised worker is isolated, not trusted to self-report |", "• A retry that repeats a non-idempotent action is not a retry. It is a second execution. The lab blocks it."]}, {"number": 41, "slide_type": "code", "code_filename": "chapters/ch09/scenario.py", "code_language": "python", "highlight_lines": [2, 4, 5], "code_block": "    def submit(item: WorkItem) -> None:\n        decision, promoted = fleet.submit(item)\n        decisions.append(decision)\n        if decision.decision == Decision.ALLOW:\n            decisions.extend(_begin_execution(item, False, ledger, rate_window, capacity))\n        for promotion_decision, promoted_item, retry in promoted:\n            decisions.append(promotion_decision)\n            decisions.extend(_begin_execution(promoted_item, retry, ledger, rate_window, capacity))\n\n    def complete(item: WorkItem) -> None:\n        decisions.append(ledger.complete(item))\n        for promotion_decision, promoted_item, retry in fleet.complete(item.task_id):\n            decisions.append(promotion_decision)\n            if promoted_item is not None:\n                decisions.extend(_begin_execution(promoted_item, retry, ledger, rate_window, capacity))", "raw_lines": ["Lab 9 Code · Chapter 9: Admission Before Execution", "File: chapters/ch09/scenario.py", "• [Lines 1-5] Admission before execution: submit returns a decision, and execution begins only on ALLOW. The decision is recorded before the work starts.", "• [Lines 6-8] Promotion: completing work promotes queued work. The queue moves; it does not stall behind a finished task.", "• [Lines 10-15] Completion releases the worker and promotes the next item. A lease that is not released is a leak.", "• Expected result: PASS, score 1.000. Find the quarantined worker and the blocked unsafe retry in the JSON."], "highlighted_code": "<div class=\"code-line\"><span class=\"line-num\"> 1</span><span class=\"line-code\">    <span class=\"tok-kw\">def</span> submit(item: WorkItem) -&gt; <span class=\"tok-kw\">None</span>:</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 2</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        decision, promoted = fleet.submit(item)</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 3</span><span class=\"line-code\">        decisions.append(decision)</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 4</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        <span class=\"tok-kw\">if</span> decision.decision == Decision.ALLOW:</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 5</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">            decisions.extend(_begin_execution(item, <span <span class=\"tok-kw\">class</span>=\"tok-kw\">False</span>, ledger, rate_window, capacity))</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 6</span><span class=\"line-code\">        <span class=\"tok-kw\">for</span> promotion_decision, promoted_item, retry <span class=\"tok-kw\">in</span> promoted:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 7</span><span class=\"line-code\">            decisions.append(promotion_decision)</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 8</span><span class=\"line-code\">            decisions.extend(_begin_execution(promoted_item, retry, ledger, rate_window, capacity))</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 9</span><span class=\"line-code\"> </span></div>\n<div class=\"code-line\"><span class=\"line-num\">10</span><span class=\"line-code\">    <span class=\"tok-kw\">def</span> complete(item: WorkItem) -&gt; <span class=\"tok-kw\">None</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\">11</span><span class=\"line-code\">        decisions.append(ledger.complete(item))</span></div>\n<div class=\"code-line\"><span class=\"line-num\">12</span><span class=\"line-code\">        <span class=\"tok-kw\">for</span> promotion_decision, promoted_item, retry <span class=\"tok-kw\">in</span> fleet.complete(item.task_id):</span></div>\n<div class=\"code-line\"><span class=\"line-num\">13</span><span class=\"line-code\">            decisions.append(promotion_decision)</span></div>\n<div class=\"code-line\"><span class=\"line-num\">14</span><span class=\"line-code\">            <span class=\"tok-kw\">if</span> promoted_item <span class=\"tok-kw\">is</span> <span class=\"tok-kw\">not</span> <span class=\"tok-kw\">None</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\">15</span><span class=\"line-code\">                decisions.extend(_begin_execution(promoted_item, retry, ledger, rate_window, capacity))</span></div>"}, {"number": 42, "raw_lines": ["Lab 9 Evidence · Break the Fleet on Purpose", "• Run: python -m harnesslab.cli run ch09 --json", "• Tenant bulkheads: acme and globex work is separated, with per-tenant active counts. One tenant's queue does not consume the other's workers.", "• Back-pressure: the rate window and capacity epoch slow admission when the fleet is full. The fleet says 'wait' with a record, not 'fail' with a stack trace.", "• The idempotent retry: a safe retry repeats. The unsafe retry — a non-idempotent action — is blocked, and the block is recorded.", "• The compromised worker: quarantined, its task re-queued, its reports distrusted. Quota escalation is recorded when a tenant exceeds its share.", "• Expected result: PASS, score 1.000."]}, {"number": 43, "raw_lines": ["Chapter 10: Data Governance Is Runtime Engineering", "Ch 10 Abstract: long-horizon agents move through data. They retrieve records, summarize files, call APIs, update cases, send messages, write checkpoints, preserve traces, and sometimes carry data labels across days or weeks of work.", "• Data governance is a runtime harness discipline, not a static catalog or a compliance afterthought.", "• The harness must know: what class of data the agent is handling, what purpose justifies that use, which tools and models are allowed for that class, where outputs may go, what evidence must be retained, and when data must be masked, tokenized, isolated, deleted, or escalated.", "• The pattern: classification-aware tool routing, PII and secret handling, egress control, lineage, residency, compliance evidence, and long-horizon data-label persistence.", "• The lab (ch10) routes labeled data through approved profiles, blocks unsafe egress, blocks residency drift, escalates secret leakage, and proves erasure."]}, {"number": 44, "raw_lines": ["Chapter 10: Classification-Aware Routing", "A label is a fact carried through tools, memory, traces, and output — not a note in a policy document.", "| Label | Allowed model | Destination |", "|---|---|---|", "| PII, internal profile | Internal PII model | Internal systems, US region |", "| PII, consumer model | Not allowed for PII | Denied at the profile route |", "| PII, misplaced label (EU) | Residency mismatch | Denied — the label's region governs |", "| PII, lost label | No label, no route | Denied until the label is restored |", "| Secret, vault profile | Vault profile only | Rotation check, no exfiltration |", "• A lost label blocks egress. The run does not guess the classification — it stops and restores the label."]}, {"number": 45, "slide_type": "code", "code_filename": "chapters/ch10/scenario.py", "code_language": "python", "highlight_lines": [8, 9, 12], "code_block": "def _governed_route(\n    harness: Harness,\n    call: ToolCall,\n    label: DataLabel,\n    profile: ModelProfile,\n) -> list[PolicyDecision]:\n    decisions = [\n        harness.gateway.check(call),\n        _route_through_profile(call, label, profile),\n    ]\n    if all(decision.allowed for decision in decisions):\n        decisions.append(harness.governance.route(call, destination=profile.destination, region=profile.region))\n    return decisions", "raw_lines": ["Lab 10 Code · Chapter 10: The Governed Route", "File: chapters/ch10/scenario.py", "• [Lines 7-10] Two checks per route: the tool gateway checks the call, then the classification-aware profile route checks label, model, and residency.", "• [Lines 11-12] Egress only if both allow: governance routes to the profile's destination and region. A single allow is not enough.", "• In the full scenario, the same PII call is routed four ways: internal model (allowed), consumer model (denied), misplaced EU label (denied), lost label (denied until restored).", "• Expected result: PASS, score 1.000."], "highlighted_code": "<div class=\"code-line\"><span class=\"line-num\"> 1</span><span class=\"line-code\"><span class=\"tok-kw\">def</span> _governed_route(</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 2</span><span class=\"line-code\">    harness: Harness,</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 3</span><span class=\"line-code\">    call: ToolCall,</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 4</span><span class=\"line-code\">    label: DataLabel,</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 5</span><span class=\"line-code\">    profile: ModelProfile,</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 6</span><span class=\"line-code\">) -&gt; list[PolicyDecision]:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 7</span><span class=\"line-code\">    decisions = [</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 8</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        harness.gateway.check(call),</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 9</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        _route_through_profile(call, label, profile),</span></div>\n<div class=\"code-line\"><span class=\"line-num\">10</span><span class=\"line-code\">    ]</span></div>\n<div class=\"code-line\"><span class=\"line-num\">11</span><span class=\"line-code\">    <span class=\"tok-kw\">if</span> all(decision.allowed <span class=\"tok-kw\">for</span> decision <span class=\"tok-kw\">in</span> decisions):</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">12</span><span class=\"key-badge\">KEY</span><span class=\"line-code\">        decisions.append(harness.governance.route(call, destination=profile.destination, region=profile.region))</span></div>\n<div class=\"code-line\"><span class=\"line-num\">13</span><span class=\"line-code\">    <span <span class=\"tok-kw\">class</span>=\"tok-kw\">return</span> decisions</span></div>"}, {"number": 46, "raw_lines": ["Lab 10 Evidence · Prove Erasure", "• Run: python -m harnesslab.cli run ch10 --json", "• Labeled data is routed through approved profiles: the PII call reaches the internal PII model and is denied the consumer model.", "• Residency drift is blocked: the same label with an EU region does not reach the US profile. The label's region governs, not the call's preference.", "• Secret leakage is escalated: the vault query is checked, redacted, and routed through the vault profile only.", "• Labels persist across resume, and erasure is proved across memory and trace evidence. A deletion claim without evidence is a claim, not a proof.", "• Expected result: PASS, score 1.000."]}, {"number": 47, "raw_lines": ["Measured Adversarial Results · One Running HarnessLab", "One HarnessLab system, four adversarial scenarios, run on this VM. Reproduce them with python -m harnesslab.cli measure. Latency is the harness run() median over 20 in-process runs; human review counts escalated decisions.", "| Scenario (lab) | Control and evidence | What the failure did | Completion · Latency · Review |", "|---|---|---|---|", "| Poisoned context (ch05) | Context firewall, quarantine ledger: 3 items quarantined, lethal-trifecta egress denied | Untrusted instructions never reached the model; 4 trusted items released | PASS 1.000 · 0.4 ms · 0 escalations |", "| Unauthorized memory write (ch06) | Memory firewall, ledger: 2 writes gated, 7 ledger entries, tombstone on rollback | The poisoned rule never became durable memory; safe writes still stored | PASS 1.000 · 0.2 ms · 0 escalations |", "| Resume after credentials expired (ch03) | Credential broker: 2 stale grants revoked, 3 chains re-issued audience-bound | The stale credential was denied; work resumed on a fresh task credential | PASS 1.000 · 0.5 ms · 1 escalation |", "| External action, no rollback (ch08) | Runtime steering: send_customer_email blocked, 1 subrun killed, 2 checkpoints, memory rollback + tombstone | The outbound effect never happened; the draft was compensated, not erased | PASS 1.000 · 1.8 ms · 0 escalations |", "• Three of four scenarios needed zero human escalations. The controls decided in-process; the decision list is the evidence — read it in each lab's JSON."]}, {"number": 48, "raw_lines": ["Capstone · Extend One Lab With One Realistic Failure", "Pick one. Implement it in the chapter scenario, run it, and show the new decision in the JSON. The control must preserve useful agency while the run stays bounded, justified, traced, interruptible, and recoverable.", "• 1 · Stale approval: an approval granted before a pause is used after resume. Require reauthorization.", "• 2 · Borrowed credential: a subagent uses its parent credential. Deny it; issue a task-scoped credential instead.", "• 3 · Poisoned memory: an untrusted source promotes a durable rule. Gate the write; tombstone the record.", "• 4 · Thin trace: a trace omits an artifact hash. Fail the eval until the envelope is complete.", "• 5 · Unsafe retry: a retry repeats a non-idempotent action. Make the retry idempotent or block it.", "• 6 · Lost label: a data label disappears before egress. Block egress until the label is restored.", "• Demo format per team: the failure, the control, the decision in the JSON, and the artifact an auditor would read."]}, {"number": 49, "raw_lines": ["Capstone Judging · The Autonomy Review Board", "Your extension is judged the way §2.13 judges any autonomy change: by the board, not by the demo.", "| Board question | What a good answer shows |", "|---|---|---|", "| Mission | The failure, in one sentence, and the purpose it threatens |", "| Action catalog | Where the new control sits on the ladder |", "| Approval workflow | Who approves the new decision, with what evidence |", "| Budgets | What the control costs per run |", "| Long-horizon controls | What happens on pause, resume, and rollback |", "| Evidence | The JSON decision and the artifact an auditor reads |", "• A control that preserves agency and stays bounded wins over a control that only blocks. Show both: the failure stopped, and the useful work still done."]}, {"number": 50, "raw_lines": ["Implementation Boundaries · From Patterns to Code", "Four boundaries connect the security patterns to implementation. Two are enforced in HarnessLab code; two are seams the labs exercise in-process.", "| Boundary | What it enforces | In HarnessLab |", "|---|---|---|", "| Tool contracts | A tool call carries its purpose, scope, and risk — nothing else runs | ToolGateway + intent contract (Ch 1, 4); every lab call passes the gateway |", "| Model adapters | The harness, not the model, decides what a model call may carry | Seam: the scenario driver stands in for the model; no live model call |", "| Extension supply-chain | No extension runs without review, pinning, and a trust tier | In-repo scenario modules only; no dynamic install or load at runtime |", "| Protocol boundaries | Credentials and calls are audience-bound at the system edge | Credential broker issues short-lived audience-bound credentials (Ch 3) |", "• These four boundaries are where a pattern becomes code. The labs prove the first and fourth in-process; the second and third are seams, not live calls."]}, {"number": 51, "slide_type": "comparison", "raw_lines": ["Production Mapping: Where Each Lab Control Lives", "• Do not copy the lab code into production. Map each decision to the system that owns it, then ask what evidence would convince a reviewer that the control worked.", "| Lab control | Production owner | Evidence to demand |", "|---|---|---|", "| Credential broker, delegation chain | Identity plane / model gateway | Audience-bound credential, revocation record |", "| Intent contract, drift detection | Workflow engine / policy engine | Contract version, reauthorization event |", "| Context firewall, quarantine | Retrieval pipeline / tool gateway | Quarantine record with provenance |", "| Memory firewall, ledger | Memory service | Ledger entry, tombstone on rollback |", "| Trace envelope, evals | Observability backend / CI | Artifact hash, regression result |", "| Pause, checkpoint, rollback | Runtime / platform service | Checkpoint id, resume validation |", "| Bulkheads, quotas, idempotency | Fleet scheduler | Admission record, retry key |", "| Classification, egress, erasure | Data governance gateway | Label lineage, erasure proof |"]}, {"number": 52, "raw_lines": ["Design Patterns Catalog · Ten Patterns, One Page", "Each chapter's pattern, in one line. If you remember nothing else, remember this page.", "| Chapter | Pattern | One line |", "|---|---|---|", "| 1 | Control plane | Mediate what agents perceive, remember, decide, call, delegate, revise, prove |", "| 2 | Graduated autonomy | Grade control by reversibility; budget it; review it |", "| 3 | Per-agent identity | Attribute, bound, and revoke every action |", "| 4 | Intent contract | Authorize the purpose, not just the tool |", "| 5 | Trust tiers | Classify context; quarantine the untrusted |", "| 6 | State firewall | Gate memory writes; ledger them; forget verifiably |", "| 7 | Evidence traces | Seal the chain from intent to improvement |", "| 8 | Runtime steering | Intervene in grades; recover without erasing evidence |", "| 9 | Fleet admission | Admit work first; isolate tenants; retry only idempotently |", "| 10 | Classification-aware routing | Route by label; block unlabeled egress; prove erasure |"]}, {"number": 53, "slide_type": "reference_tables", "raw_lines": ["Additional References & Resources", "| Resource / Reference Title | Direct URL Link |", "|---|---|---|", "| Advanced Harness Engineering: Design Patterns for Securing Long-Horizon Multi-Agent AI Systems — slides | https://kenhuangus.github.io/harness-engineering-workshop/slides.html#1 |", "| Lab Guide — full commands and expected results | https://kenhuangus.github.io/harness-engineering-workshop/labs.html |", "| Labs repo — Harness-Engineering-Design-Patterns | https://github.com/kenhuangus/Harness-Engineering-Design-Patterns |", "| Book — Harness Engineering (Packt) | https://www.amazon.com/dp/B0HF3F86YM |", "| Book table of contents (Google Doc) | https://docs.google.com/document/d/1EtLyxS9EH0MR3WxBwG9lWkU40Lpqr4k4CKhqROGugXo/edit |", "| MAESTRO — the companion threat-modeling deck | https://kenhuangus.github.io/maestro-site/#1 |", "| Harness Engineering Masterclass slides (Packt) | https://kenhuangus.github.io/packt-harness/slides.html#1 |", "| Agentic AI Substack (Ken Huang) | https://kenhuangus.substack.com/ |"]}];

let slideLang = 'en';

    function initSlideLang() {
      const queryLang = new URLSearchParams(location.search).get('lang');
      const stored = localStorage.getItem('packt-slides-lang');
      slideLang = queryLang === 'zh' || queryLang === 'en' ? queryLang : (stored === 'zh' ? 'zh' : 'en');
      applySlideLangChrome();

    function localizedSlide(slide) {
      const pack = window.SLIDES_ZH;
      if (slideLang !== 'zh' || !pack || !pack.lines) return slide;
      const lines = pack.lines[String(slide.number)];
      if (!lines || lines.length !== (slide.raw_lines || []).length) return slide;
      return Object.assign({}, slide, { raw_lines: lines });
    }

    function uiText(en, zh) {
      return slideLang === 'zh' ? zh : en;
    }

    function translateDom(root) {
      const pack = window.SLIDES_ZH;
      if (!root || slideLang !== 'zh' || !pack || !pack.phrases) return;
      const map = pack.phrases;
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      const nodes = [];
      let node;
      while ((node = walker.nextNode())) nodes.push(node);
      nodes.forEach((textNode) => {
        const raw = textNode.nodeValue;
        if (!raw || !raw.trim()) return;
        const trimmed = raw.trim();
        if (!Object.prototype.hasOwnProperty.call(map, trimmed)) return;
        textNode.nodeValue = raw.replace(trimmed, map[trimmed]);
      });
    }

    function applySlideLangChrome() {
      document.documentElement.lang = slideLang === 'zh' ? 'zh-CN' : 'en';

    function cleanNumbers(text) {
      if (/^\d{1,2}:\d{2}/.test(text.trim())) return text.trim();
      text = text.replace(/^(\d+[\.\)\:]|\d+\s*&\s*\d+[\.\)\:])\s+/, '');

    function formatTextWithCode(text) {
      const keywords = ['CLAUDE.md', 'AGENTS.md', 'SPEC.md', 'MEMORY.md', 'CLAUDE.local.md', 'pytest', 'events.jsonl', 'telemetry.jsonl', 'rm -rf', 'write_file', 'read_file', '.claude-plugin/plugin.json', 'SKILL.md', 'mcp_client_runner.py', 'mcp_server_demo.py', 'core_harness_stack.py', 'guardrails_engine.py', 'spec_driven_verifier.py', 'tda_reliability_pipeline.py', 'multi_agent_team_simulator.py', 'five_step_sop_pipeline.py', 'production_harness_audit.py', 'is_relative_to()', 'ast.parse()', 'PreToolUse', 'PostToolUse', 'MCPServer', 'permissionDecision', 'approvals.json', 'ZeroDivisionError', 'pending_push.json', 'scripts/', 'references/', 'assets/', '.claude/workflows/'];
      
      text = text.replace(
        /\[(.*?)\]\(((?:https?:\/\/|file:\/\/\/)[^\s<>"']+)\)/g,
        (match, label, url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`
      );

      text = text.replace(
        /(https?:\/\/[^\s<>"']+|file:\/\/\/[^\s<>"']+)/g,
        (match) => {
          let url = match.replace(/[.,;:)]+$/, '');
          let trailing = match.slice(url.length);
          return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>${trailing}`;
        }
      );
      
      keywords.forEach(kw => {
        text = text.replaceAll(kw, `<code>${kw}</code>`);
      });
      return text;
    }

    function copyCommand(btn, text) {
      if (!btn) return;
      const originalHtml = btn.innerHTML;
      
      function setSuccess() {
        btn.classList.add('copied');
        btn.innerHTML = '<span class="copy-icon">✓</span> Copied!';
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = originalHtml;
        }, 1800);
      }

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(setSuccess).catch(() => {
          fallbackCopy(text, setSuccess);
        });
      } else {
        fallbackCopy(text, setSuccess);
      }
    }

    function fallbackCopy(text, cb) {
      const textArea = document.createElement('textarea');
      textArea.value = text;
      textArea.style.position = 'fixed';
      textArea.style.left = '-9999px';
      textArea.style.top = '0';
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        const successful = document.execCommand('copy');
        if (successful && cb) cb();
      } catch (err) {
        console.error('Fallback copy failed', err);
      }
      document.body.removeChild(textArea);
    }

    function renderMarkdownTable(tableLines, tableClass = 'slide-table') {
      if (!tableLines || tableLines.length < 2) return '';
      const rows = tableLines.map(l => l.split('|').map(c => c.trim()).filter((c, idx, arr) => idx > 0 && idx < arr.length - 1));
      if (rows.length < 2) return '';
      
      const header = rows[0];
      const dataRows = rows.slice(2); // skip separator row
      
      let html = `<table class="${tableClass}"><thead><tr>`;
      header.forEach(h => {
        html += `<th>${formatTextWithCode(h)}</th>`;
      });
      html += '</tr></thead><tbody>';
      
      dataRows.forEach(r => {
        html += '<tr>';
        r.forEach((cell, idx) => {
          const isFirstCol = idx === 0;
          const formattedCell = formatTextWithCode(cell);
          html += `<td>${isFirstCol ? '<strong>' + formattedCell + '</strong>' : formattedCell}</td>`;
        });
        html += '</tr>';
      });
      
      html += '</tbody></table>';
      return html;
    }

    function formatBullets(lines) {
      if (!lines || lines.length === 0) return '';
      
      const hasTree = lines.some(l => l.includes('├──') || l.includes('└──') || l.includes('custom-agent-skill/'));
      const hasTable = lines.some(l => l.trim().startsWith('|') && l.trim().endsWith('|'));
      
      if (hasTree) {
        let beforeTree = [];
        let treeLines = [];
        let afterTree = [];
        let state = 'before';
        
        lines.forEach(l => {
          const trimmed = l.trim();
          if (trimmed.startsWith('custom-agent-skill/') || trimmed.startsWith('├──') || trimmed.startsWith('│') || trimmed.startsWith('└──')) {
            state = 'tree';
            treeLines.push(l);
          } else if (state === 'tree') {
            state = 'after';
            afterTree.push(l);
          } else {
            beforeTree.push(l);
          }
        });
        
        let html = '';
        if (beforeTree.length > 0) html += formatBullets(beforeTree);
        if (treeLines.length > 0) {
          html += `<pre class="tree-block"><code>${treeLines.join('\n')}</code></pre>`;
        }
        if (afterTree.length > 0) html += formatBullets(afterTree);
        return html;
      }

      if (hasTable) {
        let beforeTable = [];
        let tableLines = [];
        let afterTable = [];
        let state = 'before';
        
        lines.forEach(l => {
          const trimmed = l.trim();
          if (trimmed.startsWith('|') && trimmed.endsWith('|')) {
            state = 'table';
            tableLines.push(trimmed);
          } else if (state === 'table') {
            state = 'after';
            afterTable.push(l);
          } else {
            beforeTable.push(l);
          }
        });
        
        let html = '';
        if (beforeTable.length > 0) html += formatBullets(beforeTable);
        if (tableLines.length > 0) html += renderMarkdownTable(tableLines);
        if (afterTable.length > 0) html += formatBullets(afterTable);
        return html;
      }

      const populatedLines = lines.filter(line => line.trim());
      if (populatedLines.length === 0) return '';

      const hasIndented = populatedLines.some(l => /^\s{2,}|\t/.test(l));
      const denseClass = (!hasIndented && populatedLines.length >= DENSE_BULLET_MIN_LINES) ? ' dense-columns' : '';
      let html = '';
      let listOpen = false;
      let groupOpen = false;
      let subListOpen = false;

      populatedLines.forEach((line, idx) => {
        const isIndented = /^\s{2,}|\t/.test(line);
        const trimmed = line.trim();
        const hasBullet = /^[•\-\*\ufffd]/.test(trimmed);

        let cleanText = trimmed.replace(/^[•\-\*\ufffd]\s*/, '').trim();
        cleanText = cleanNumbers(cleanText);

        const labUrl = cleanText.match(/^Lab demo:\s*(https:\/\/[^\s]+)/i);
        if (labUrl) {
          cleanText = `<a href="${labUrl[1]}" target="_blank" rel="noopener noreferrer">🔗 Lab demo: open this module in GitHub</a>`;
        } else {
          cleanText = formatTextWithCode(cleanText);
        }

        if (!cleanText) return;

        if (!hasBullet && !isIndented) {
          if (subListOpen) { html += '</ul>'; subListOpen = false; }
          if (groupOpen) { html += '</li>'; groupOpen = false; }
          if (listOpen) { html += '</ul>'; listOpen = false; }
          html += `<div class="slide-lead-header">${cleanText}</div>`;
          return;
        }

        if (!listOpen) {
          html += `<ul class="main-bullets${denseClass}">`;
          listOpen = true;
        }

        if (isIndented && hasBullet) {
          if (!groupOpen) {
            html += '<li class="bullet-group">';
            groupOpen = true;
          }
          if (!subListOpen) {
            html += '<ul class="sub-bullets">';
            subListOpen = true;
          }
          html += `<li class="sub-bullet">${cleanText}</li>`;
        } else {
          if (subListOpen) {
            html += '</ul>';
            subListOpen = false;
          }
          if (groupOpen) {
            html += '</li>';
          }
          html += `<li class="bullet-group"><div class="primary-bullet">${cleanText}</div>`;
          groupOpen = true;
        }
      });

      if (subListOpen) html += '</ul>';
      if (groupOpen) html += '</li>';
      if (listOpen) html += '</ul>';
      return html;
    }

                    ? '运行全部模块测试（期望 <code>Summary: 14 passed, 0 failed</code>）：'
                    : 'Run the harness test runner across all modules (expects <code>Summary: 14 passed, 0 failed</code>):'}</div>
                  <div class="cmd-code-row">
                    <span class="cmd-code-prompt">$</span>
                    <code class="cmd-code-text">python run_all_modules.py</code>
                    <button class="cmd-copy-btn" onclick="copyCommand(this, 'python run_all_modules.py')" title="Copy verify command">
                      <span class="copy-icon">📋</span> Copy
                    </button>
                  </div>
                </div>

              </div>
            </div>
          </div>
        `;
      } else if (slide.number === 49 || slide.number === 83 || (slide.raw_lines && slide.raw_lines[0] && slide.raw_lines[0].includes('Capstone Project'))) {
        const tableLines = slide.raw_lines.filter(l => l.trim().startsWith('|') && l.trim().endsWith('|'));
        bodyHtml += `
          <div id="slide-content-wrap" class="capstone-layout-grid">
            <div class="capstone-info-card">
              <div class="ref-table-card-header">
                ⚡ Setup, Execution &amp; Multi-Provider AI Suite Engine
              </div>
              <div class="capstone-info-body">
                <div class="capstone-section">
                  <div class="capstone-section-title">💻 Step-by-Step Universal Setup (Zero-to-Run for All Students)</div>
                  <div class="capstone-cmd-box" style="background:transparent; border:none; padding:0; gap:0.28rem;">
                    <div class="cmd-code-row">
                      <span class="cmd-code-prompt">1. Clone &amp; CD:</span>
                      <code class="cmd-code-text">git clone https://github.com/kenhuangus/packt-harness.git &amp;&amp; cd packt-harness</code>
                      <button class="cmd-copy-btn" onclick="copyCommand(this, 'git clone https://github.com/kenhuangus/packt-harness.git && cd packt-harness')" title="Copy Command">
                        <span class="copy-icon">📋</span> Copy
                      </button>
                    </div>
                    <div class="cmd-code-row">
                      <span class="cmd-code-prompt">2a. Create venv:</span>
                      <code class="cmd-code-text">python -m venv .venv</code>
                      <button class="cmd-copy-btn" onclick="copyCommand(this, 'python -m venv .venv')" title="Copy create venv command">
                        <span class="copy-icon">📋</span> Copy
                      </button>
                    </div>
                    <div class="cmd-code-row">
                      <span class="cmd-code-prompt">2b. Activate (Win PS):</span>
                      <code class="cmd-code-text">.venv\Scripts\Activate.ps1</code>
                      <button class="cmd-copy-btn" onclick="copyCommand(this, '.venv\\\\Scripts\\\\Activate.ps1')" title="Copy Windows PowerShell activate">
                        <span class="copy-icon">📋</span> Copy
                      </button>
                    </div>
                    <div class="cmd-code-row">
                      <span class="cmd-code-prompt">2b. Activate (Mac/Linux):</span>
                      <code class="cmd-code-text">source .venv/bin/activate</code>
                      <button class="cmd-copy-btn" onclick="copyCommand(this, 'source .venv/bin/activate')" title="Copy macOS/Linux activate">
                        <span class="copy-icon">📋</span> Copy
                      </button>
                    </div>
                    <div class="cmd-code-row">
                      <span class="cmd-code-prompt">3. Install:</span>
                      <code class="cmd-code-text">pip install -r requirements.txt &amp;&amp; python -m playwright install chromium</code>
                      <button class="cmd-copy-btn" onclick="copyCommand(this, 'pip install -r requirements.txt && python -m playwright install chromium')" title="Copy Command">
                        <span class="copy-icon">📋</span> Copy
                      </button>
                    </div>
                    <div class="cmd-code-row">
                      <span class="cmd-code-prompt">${slideLang === 'zh' ? '4. 配置:' : '4. Config:'}</span>
                      <code class="cmd-code-text">${slideLang === 'zh' ? 'copy .env.example.zh .env' : 'copy .env.example.en .env'}</code>
                      <button class="cmd-copy-btn" onclick="copyCommand(this, '${slideLang === 'zh' ? 'copy .env.example.zh .env' : 'copy .env.example.en .env'}')" title="${slideLang === 'zh' ? 'Copy LM Studio .env' : 'Copy DGX Spark .env'}">
                        <span class="copy-icon">📋</span> ${slideLang === 'zh' ? '中文' : 'Copy'}
                      </button>
                    </div>
                    <div class="cmd-code-row">
                      <span class="cmd-code-prompt">${slideLang === 'zh' ? '4. macOS/Linux:' : '4. macOS/Linux:'}</span>
                      <code class="cmd-code-text">${slideLang === 'zh' ? 'cp .env.example.zh .env' : 'cp .env.example.en .env'}</code>
                      <button class="cmd-copy-btn" onclick="copyCommand(this, '${slideLang === 'zh' ? 'cp .env.example.zh .env' : 'cp .env.example.en .env'}')" title="${slideLang === 'zh' ? 'Copy LM Studio .env' : 'Copy DGX Spark .env'}">
                        <span class="copy-icon">📋</span> Copy
                      </button>
                    </div>
                    <div class="cmd-code-row">
                      <span class="cmd-code-prompt">5. Run UI:</span>
                      <code class="cmd-code-text">python deep_research_agent/server.py 8090</code>
                      <button class="cmd-copy-btn" onclick="copyCommand(this, 'python deep_research_agent/server.py 8090')" title="Copy Command">
                        <span class="copy-icon">📋</span> Copy
                      </button>
                    </div>
                    <div class="cmd-code-row">
                      <span class="cmd-code-prompt">6. Test:</span>
                      <code class="cmd-code-text">pytest -v</code>
                      <button class="cmd-copy-btn" onclick="copyCommand(this, 'pytest -v')" title="Copy Command">
                        <span class="copy-icon">📋</span> Copy
                      </button>
                    </div>
                  </div>
                </div>

                <div class="capstone-section">
                  <div class="capstone-section-title">${slideLang === 'zh' ? '🔑 aisuite 提供商（.env 配置）' : '🔑 aisuite Provider Support (.env Configuration)'}</div>
                  <div class="capstone-providers-grid">
                    ${slideLang === 'zh'
                      ? `<div class="provider-pill">🈶 <strong>默认 中文 / LM Studio:</strong> <code>.env.example.zh</code> → <code>http://127.0.0.1:1234/v1</code></div>`
                      : `<div class="provider-pill">💻 <strong>Default English / DGX Spark:</strong> <code>.env.example.en</code> → <code>http://192.168.1.164:8888/v1</code> (<code>unsloth/Qwen3.6-35B-A3B-NVFP4</code>)</div>`}
                    <div class="provider-pill">🟢 <strong>OpenAI:</strong> <code>OPENAI_API_KEY=sk-proj...</code></div>
                    <div class="provider-pill">🌐 <strong>OpenRouter:</strong> <code>OPENROUTER_API_KEY=sk-or-...</code></div>
                    <div class="provider-pill">🦙 <strong>Ollama:</strong> <code>LLM_PROVIDER=ollama</code> (Port 11434)</div>
                    <div class="provider-pill">🔵 <strong>Gemini (Google):</strong> <code>GEMINI_API_KEY=AIzaSy...</code></div>
                    <div class="provider-pill">🧡 <strong>Claude (Anthropic):</strong> <code>ANTHROPIC_API_KEY=sk-ant...</code></div>
                  </div>
                </div>

                <div class="capstone-section">
                  <div class="capstone-section-title">${slideLang === 'zh' ? '🧠 统一 AI Suite 与两轮自反思引擎' : '🧠 Unified AI Suite &amp; 2-Turn Self-Reflection Engine'}</div>
                  <div class="capstone-text-desc">
                    ${slideLang === 'zh'
                      ? '通过 Andrew Ng 的 <strong>aisuite</strong> 统一客户端：用 <code>.env</code> 在 LM Studio、OpenAI、OpenRouter、Ollama、Gemini、Claude 之间切换。多智能体 SOP 执行<strong>两轮自反思</strong>（第 1 轮：缺口反思 ➔ 第 2 轮：对抗审计），覆盖 6 条零 API 公开数据流。'
                      : 'English capstone default is <strong>DGX Spark</strong> via <code>.env.example.en</code>. One unified client via Andrew Ng\'s <strong>aisuite</strong>: switch providers in <code>.env</code>. Multi-agent SOP executes <strong>Two-Turn Self-Reflection</strong> (Turn 1: Gap Reflection ➔ Turn 2: Adversarial Audit) across 6 Zero-API public streams.'}
                  </div>
                </div>
              </div>
            </div>

            <div class="ref-table-card">
              <div class="ref-table-card-header">
                🚀 Capstone Artifacts &amp; Direct Repository Links
              </div>
              ${renderMarkdownTable(tableLines, 'ref-table')}
            </div>
          </div>
        `;
      } else if (slide.number === slidesData.length || (slide.raw_lines && slide.raw_lines[0] && slide.raw_lines[0].includes('Additional References'))) {
        bodyHtml += '<div id="slide-content-wrap" class="slide-content-wrapper">';
        if (restLines.length > 0) {
          bodyHtml += formatBullets(restLines);
        }
        bodyHtml += `
            <div class="ref-table-card">
              <div class="ref-table-card-header">🏆 Official Amazon Publication (#1 Best Seller)</div>
              <table class="ref-table">
                <thead>
                  <tr>
                    <th style="text-align: center;">Book Cover &amp; Kindle / Paperback Listing</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td style="text-align: center; padding: 0.50rem; background: #FAF8F2;">
                      <a href="https://www.amazon.com/dp/B0HF3F86YM" target="_blank" rel="noopener noreferrer" class="book-screenshot-link" title="Open Harness Engineering Book on Amazon">
                        <img src="assets/images/harness_engineering_book.png" alt="Harness Engineering: Design Patterns for Securing Long-Horizon Multi-Agent AI Systems by Ken Huang" class="book-screenshot-img" />
                        <div class="book-screenshot-badge">📖 Amazon Kindle &amp; Paperback ➔</div>
                      </a>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>`;
        bodyHtml += '</div>';
      } else {
        bodyHtml += '<div id="slide-content-wrap" class="slide-content-wrapper">';
        if (svgMap[slide.number]) {
          bodyHtml += svgMap[slide.number];
        }
        if (restLines.length > 0) {
          bodyHtml += formatBullets(restLines);
        }
        bodyHtml += '</div>';
      }

      bodyEl.innerHTML = bodyHtml;
      translateDom(bodyEl);
      
      // Dynamic Text-Sizing Engine:
      // Maximize font size so text and graphics fill >= 82% to 92% of the card height
      // while guaranteeing ZERO overflow and ZERO scrollbars
      if (!isCode && !isSkill) {
        bodyEl.style.setProperty('--fit-scale', '1.0');
        const wrapper = document.getElementById('slide-content-wrap') || bodyEl;
        const clientH = bodyEl.clientHeight;
        const targetH = clientH * 0.90;
        let maxScale = 3.25;
        const isSetupSlide = !!wrapper.querySelector('.setup-slide-grid');
        if (isSetupSlide) {
          maxScale = 1.70;
        } else if (wrapper.querySelector('.sub-bullets') || wrapper.querySelector('.capstone-layout-grid') || wrapper.querySelector('.course-map-columns-grid') || wrapper.querySelector('.thesis-grid') || wrapper.querySelector('.slide-1-container')) {
          maxScale = 1.20;
        } else if (wrapper.querySelector('.main-bullets')) {
          maxScale = 1.50;
        }
        
        let scale = 1.0;
        let growIter = 0;
        while (wrapper.offsetHeight < targetH && bodyEl.scrollHeight <= clientH && scale < maxScale && growIter < 45) {
          scale += 0.05;
          bodyEl.style.setProperty('--fit-scale', scale.toFixed(2));
          growIter++;
        }
        
        // If scaled over client height or causing scroll, scale down until it fits with zero scroll.
        // Setup slide uses auto-height cards; do not shrink just because the wrapper fills the card.
        let shrinkIter = 0;
        while ((bodyEl.scrollHeight > clientH || (!isSetupSlide && wrapper.offsetHeight > (clientH - 6))) && scale > 0.50 && shrinkIter < 60) {
          scale -= 0.02;
          bodyEl.style.setProperty('--fit-scale', scale.toFixed(2));
          shrinkIter++;
        }
      } else {
        bodyEl.style.setProperty('--fit-scale', '1.0');
      }

      const pct = ((idx + 1) / slidesData.length) * 100;
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    function renderGrid() {
      const gridContainer = document.getElementById('grid-mode');
      gridContainer.innerHTML = '';
      slidesData.forEach((slide, idx) => {
        const card = document.createElement('div');
        card.className = 'grid-slide-card';
        card.onclick = () => { isGridMode = true; toggleMode(); renderSlide(idx); };
        
        let title = slide.raw_lines[0] || `Slide ${slide.number}`;
        let body = (slide.raw_lines.slice(1, 4).join(' ') || (slide.code_block ? slide.code_block.slice(0, 120) : '')).replace(/[•\-#]/g, '');
        let typeBadge = slide.slide_type ? `<span style="background:var(--accent-sf); color:var(--accent-dk); font-size:0.68rem; font-weight:700; padding:2px 6px; border-radius:4px;">${slide.slide_type.toUpperCase()}</span>` : '';
        
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
            <span style="font-size:0.75rem; color:var(--ink); font-weight:800;">SLIDE ${slide.number}</span>
            ${typeBadge}
          </div>
          <div class="grid-slide-title">${title}</div>
          <div class="grid-slide-body">${body}...</div>
        `;
        gridContainer.appendChild(card);
      });
    }

    function prevSlide() { renderSlide(currentIdx - 1); }
    function nextSlide() { renderSlide(currentIdx + 1); }
    function goToSlide(val) { renderSlide(parseInt(val)); }

    function jumpToEnteredSlide() {
      const input = document.getElementById('goto-input');
      if (!input) return;
      const val = parseInt(input.value, 10);
      if (!isNaN(val) && val >= 1 && val <= slidesData.length) {
        renderSlide(val - 1);
        input.value = '';
      } else {
        alert(`Please enter a slide number between 1 and ${slidesData.length}.`);
      }
    }

    function toggleMode() {
      isGridMode = !isGridMode;
      document.getElementById('presentation-mode').style.display = isGridMode ? 'none' : 'flex';
      document.getElementById('grid-mode').style.display = isGridMode ? 'grid' : 'none';
      document.getElementById('mode-text').innerText = isGridMode ? 'Presentation Mode' : 'Grid View';
      document.getElementById('mode-icon').innerText = isGridMode ? '📺' : '📜';
      if (isGridMode) renderGrid();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') nextSlide();
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
      if (e.key === 'f' || e.key === 'F') toggleFullscreen();
      if (e.key === 'm' || e.key === 'M') toggleMode();
      if (e.key === 'g' || e.key === 'G') {
        e.preventDefault();
        const gotoInp = document.getElementById('goto-input');
        if (gotoInp) { gotoInp.focus(); gotoInp.select(); }
      }
    });

    window.addEventListener('resize', () => {
      if (!isGridMode) renderSlide(currentIdx);
    });

    function getInitialSlideIndex() {
      const hash = window.location.hash.replace('#', '');
      if (hash) {
        const num = parseInt(hash, 10);
        if (!isNaN(num)) {
          const foundIdx = slidesData.findIndex(s => s.number === num);
          if (foundIdx !== -1) return foundIdx;
        }
      }
      return 0;
    }

    window.addEventListener('hashchange', () => {
      const idx = getInitialSlideIndex();
      if (idx !== currentIdx) renderSlide(idx);
    });

    initSlideLang();
    rebuildSlideSelect();
    renderSlide(getInitialSlideIndex());
  </script>
</body>
</html>
